<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navanta Lens — Prototype v2 · Updated Experience</title>
<style>
/* ── Navanta Lens design tokens (from the deployed build / IRIS chrome) ── */
:root{
  --bg:#F6F7F9; --card:#FFFFFF;
  --line:#E8EAF0; --line2:#E2E8F0;
  --ink:#181A1B; --ink2:#52525C; --ink3:#71717A; --ink4:#94A3B8;
  --indigo:#2F2B6E; --indigo-h:#3D3790;
  --merc:#59349C; --merc-deep:#4A2B82; --merc-bg:#F5EFFF; --merc-bg2:#F3F0FE; --merc-line:#E3D2FF; --merc-chip:#EDE6FB;
  --blue:#2563EB; --blue-bg:#E8F0FE;
  --amber:#B45309; --amber-bg:#FDF0E0;
  --green:#008234; --green2:#16A34A; --green-bg:#ECFDF5;
  --warn:#9E3900; --warn-bg:#FFFBEA; --warn-line:#F0E3BB;
  --red:#C22F2F; --red-bg:#FDECEC;
  --muted:#F4F4F5; --raised:#FAFAFB;
  --r:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sh:0 0 1px rgba(0,0,0,.22),0 1px 4px rgba(0,0,0,.06);
  --sh2:0 4px 24px rgba(24,26,64,.14),0 0 1px rgba(0,0,0,.3);
  --bar-grad:linear-gradient(to right,#89A9E5,#234687);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;overflow:hidden}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
::placeholder{color:var(--ink4)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── App shell ── */
#app{display:flex;height:100vh;width:100%}
.rail{width:64px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0 12px;gap:5px;flex-shrink:0;z-index:30}
.rail .logo{width:34px;height:34px;border-radius:9px;background:var(--indigo);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;letter-spacing:.02em;margin-bottom:12px}
.rail .sep{width:32px;height:1px;background:var(--line);margin:6px 0}
.rail .grp{font-size:8.5px;font-weight:700;letter-spacing:.1em;color:var(--ink4);text-transform:uppercase;margin:2px 0 1px}
.rail .spacer{flex:1}
.rail .avatar{width:34px;height:34px;border-radius:50%;background:var(--indigo);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.nbtn{position:relative;width:44px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.nbtn:hover{background:var(--bg)}
.nbtn.on{background:var(--merc-bg);color:var(--merc)}
.nbtn.dim{color:#C4C9D4}
.nbtn svg{width:20px;height:20px}
.nbtn .bdg{position:absolute;top:2px;right:2px;background:var(--merc);color:#fff;font-size:9.5px;font-weight:700;border-radius:99px;padding:1px 5px;line-height:1.3}
.nbtn .bdg.red{background:var(--red)}
.nbtn .tip{position:absolute;left:54px;top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;font-size:11.5px;padding:4px 9px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:80}
.nbtn:hover .tip,.nbtn:focus-visible .tip{opacity:1}
.main{flex:1;display:flex;flex-direction:column;min-width:0;transition:margin-right .18s ease}
.main.mercer-open{margin-right:390px}
.topbar{height:56px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 20px;flex-shrink:0;z-index:20}
.topbar .ttl{font-weight:700;font-size:15px;white-space:nowrap}
.topbar .crumb{font-size:12px;color:var(--ink3);white-space:nowrap}
.topbar .grow{flex:1}
.scopebtn{display:flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:600;background:var(--card);white-space:nowrap}
.scopebtn:hover{border-color:var(--ink4)}
.scopebtn .sv{color:var(--merc);font-weight:700}
.scopebtn .car{color:var(--ink4);font-size:9px}
.askbtn{display:flex;align-items:center;gap:7px;background:var(--indigo);color:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.askbtn:hover{background:var(--indigo-h)}
.content{flex:1;overflow-y:auto;padding:20px 24px 80px;scroll-behavior:smooth}
.screen{max-width:1220px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.stamp{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stamp b{color:var(--ink2);font-weight:600}

/* ── Generic surfaces ── */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.panel .ph{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.panel .ph .t{font-weight:700;font-size:14.5px}
.panel .ph .s{font-size:12px;color:var(--ink3)}
.panel .ph .grow{flex:1}
.panel .pb{padding:16px 18px}
.panel .pb.tight{padding:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.kpi .kl{font-size:12.5px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:5px}
.kpi .kv{font-size:23px;font-weight:800;margin:5px 0 2px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .kv.good{color:var(--green)}
.kpi .kv.bad{color:var(--red)}
.kpi .kc{font-size:11.5px;color:var(--ink3)}
.info{width:15px;height:15px;border-radius:50%;border:1.3px solid var(--ink4);color:var(--ink4);font-size:9.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;background:none;line-height:1}
.info:hover,.info:focus-visible{border-color:var(--merc);color:var(--merc)}

/* ── Buttons (DS roles: primary=indigo · christy=mercer · outline=white) ── */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:8px 15px;font-size:13px;font-weight:600;border:1px solid var(--line2);background:var(--card);color:var(--ink)}
.btn:hover{border-color:var(--ink4)}
.btn.pri{background:var(--indigo);border-color:var(--indigo);color:#fff}
.btn.pri:hover{background:var(--indigo-h)}
.btn.christy{background:var(--merc);border-color:var(--merc);color:#fff}
.btn.christy:hover{background:var(--merc-deep)}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nbtn:focus-visible,.tab:focus-visible,.chiplink:focus-visible{outline:2px solid var(--merc);outline-offset:1px}
.linkbtn{color:var(--merc);font-weight:600;font-size:12px;cursor:pointer;background:none;border:none;display:inline-flex;align-items:center;gap:4px}
.linkbtn:hover{text-decoration:underline}

/* ── Pills & chips ── */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}
.chip.at{background:var(--blue-bg);color:var(--blue)}
.chip.aoh{background:var(--amber-bg);color:var(--amber)}
.chip.both{background:#ECEEF2;color:var(--ink2)}
.chip.lever{background:#ECEEF2;color:var(--ink2)}
.chip.lever.cons{background:var(--blue-bg);color:var(--blue)}
.chip.lever.warn{background:var(--warn-bg);color:var(--warn)}
.chip.flag{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line);cursor:default}
.chip.drift{background:var(--red-bg);color:var(--red)}
.chip.new{background:var(--merc-bg);color:var(--merc)}
.chip.changed{background:var(--blue-bg);color:var(--blue)}
.chip.ok{background:var(--green-bg);color:var(--green)}
.chip.stage{background:#ECEEF2;color:var(--ink2)}
.chip.ev{background:var(--blue-bg);color:var(--blue)}
.chip.bench{background:var(--warn-bg);color:var(--warn)}
.chip.live{background:var(--green-bg);color:var(--green)}
.chip.illus{background:#ECEEF2;color:var(--ink3)}
.chip.anchor{background:var(--merc-bg);color:var(--merc)}
.chip.oem{background:var(--warn-bg);color:var(--warn)}

/* ── Confidence meter (v2: band word + 99 display ceiling) ── */
.conf{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.confbar{width:54px;height:5px;border-radius:99px;background:var(--line);overflow:hidden;position:relative;flex-shrink:0}
.confbar.md{width:84px;height:6px}
.confbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#86EFAC,#16A34A)}
.confbar.b-med i{background:linear-gradient(90deg,#FDE68A,#F59E0B)}
.confbar.b-dir i{background:linear-gradient(90deg,#E5E7EB,#9CA3AF)}
.conf .cn{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.conf .cw{font-size:11px;font-weight:700}
.conf .cw.high{color:var(--green)} .conf .cw.med{color:var(--amber)} .conf .cw.dir{color:var(--ink3)}

/* ── Tabs ── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 18px;flex-wrap:wrap}
.tab{padding:11px 13px;font-size:13px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center;background:none}
.tab .ct{background:#ECEEF2;border-radius:99px;font-size:11px;padding:0 7px;font-weight:700}
.tab.on{color:var(--ink);border-bottom-color:var(--indigo)}
.tab.on .ct{background:var(--merc-bg);color:var(--merc)}
.tab:hover{color:var(--ink)}

/* ── Tables ── */
.tblwrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;color:var(--ink3);font-weight:700;padding:9px 13px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card)}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--ink)}
.tbl th .arr{font-size:9px;color:var(--merc)}
.tbl td{padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.rowlink{cursor:pointer}
.tbl tr.rowlink:hover td{background:#FAFBFD}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td .sub{display:block;font-size:11.5px;color:var(--ink3);margin-top:1px}
.tbl tr.row-resolved td{background:var(--green-bg)!important;transition:background .2s}
.tbl tr.row-dismissed td{background:var(--muted)!important;transition:background .2s}
.tbl tr.row-fading td{opacity:.25;transition:opacity .2s}
.tbl input[type=checkbox]{width:15px;height:15px;accent-color:var(--merc);cursor:pointer}

/* ── Toolbar / facets ── */
.toolbar{display:flex;align-items:center;gap:8px;padding:12px 18px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:9px;padding:6px 11px;background:var(--card);min-width:220px;flex:1;max-width:320px}
.search input{border:none;outline:none;flex:1;font-size:13px;background:none}
.fsel{border:1px solid var(--line2);border-radius:9px;padding:6px 9px;font-size:12.5px;font-weight:600;background:var(--card);color:var(--ink2);max-width:210px}
.ftog{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--ink2);background:var(--card)}
.ftog .ct{background:#ECEEF2;border-radius:99px;font-size:10.5px;padding:0 6px;font-weight:700}
.ftog.on{background:var(--blue-bg);border-color:#BFD6FB;color:var(--blue)}
.ftog.on .ct{background:#fff}
.sortlbl{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);font-weight:600;white-space:nowrap}
.sortlbl select{border:1px solid var(--line2);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:600;background:var(--card)}

/* ── Bulk triage bar ── */
.bulkbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:10px;background:var(--indigo);color:#fff;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;box-shadow:var(--sh2);margin:10px 18px 0}
.bulkbar .grow{flex:1}
.bulkbar .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.bulkbar .btn:hover{background:rgba(255,255,255,.22)}

/* ── Mercer surfaces ── */
.mercblock{background:linear-gradient(180deg,#FAF7FF 0%,#FFFFFF 55%);border:1px solid var(--merc-line);border-radius:var(--r);padding:14px 18px;box-shadow:var(--sh)}
.mercblock .mh{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink);font-size:13.5px;margin-bottom:7px;flex-wrap:wrap}
.mercblock .mh .grow{flex:1}
.mercblock .mh .when{font-size:11.5px;color:var(--ink3);font-weight:500}
.mercblock .mt{font-size:14px;line-height:1.55}
.star{width:15px;height:15px;flex-shrink:0;color:var(--merc)}
.minitiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:9px;margin-top:12px}
.minitile{background:#F8F3FF;border:1px solid #DAC4FF;border-radius:9px;padding:9px 12px}
.minitile .v{font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums}
.minitile .l{font-size:11.5px;color:var(--ink2);font-weight:600;margin-top:1px;display:flex;align-items:center;gap:4px}
.minitile .c{font-size:10.5px;color:var(--ink3)}
.caveat{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;padding:11px 15px;font-size:12.5px;color:#6B5310}
.caveat b{display:block;color:#5A4A12;margin-bottom:2px;font-size:12.5px}
.notebox{background:var(--blue-bg);border:1px solid #C9DCFB;border-radius:10px;padding:11px 15px;font-size:12.5px;color:#1E3A8A}
.notebox b{display:block;margin-bottom:2px}
.errbox{background:var(--red-bg);border:1px solid #F3C4C4;border-radius:10px;padding:12px 15px;font-size:13px;color:#7A2222;display:flex;align-items:flex-start;gap:10px}
.errbox b{display:block;margin-bottom:2px;color:var(--red)}

/* ── Attention strip ── */
.astrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.acard{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);cursor:pointer;text-align:left}
.acard:hover{border-color:var(--ink4)}
.acard .ic{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.acard .n{font-size:19px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.acard .l{font-size:11.5px;color:var(--ink2);font-weight:600;line-height:1.3}
.acard .go{margin-left:auto;color:var(--ink4);font-size:13px}
.ic.merc{background:var(--merc-bg);color:var(--merc)}
.ic.red{background:var(--red-bg);color:var(--red)}
.ic.green{background:var(--green-bg);color:var(--green)}
.ic.blue{background:var(--blue-bg);color:var(--blue)}

/* ── Value funnel ── */
.funnel .frow{display:grid;grid-template-columns:92px 1fr 150px;align-items:center;gap:12px;margin:9px 0}
.funnel .fl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.funnel .ftrack{height:22px;border-radius:7px;background:var(--raised);border:1px solid var(--line);overflow:hidden}
.funnel .ftrack i{display:block;height:100%;border-radius:6px 0 0 6px;transition:width .3s}
.funnel .fv{text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.funnel .fv .sub{display:block;font-size:10.5px;color:var(--ink3);font-weight:500}

/* ── Program summary cards ── */
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.pcard .pt{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px}
.pcard .prow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2)}
.pcard .prow b{font-variant-numeric:tabular-nums;color:var(--ink)}
.pcard .pfoot{margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}

/* ── Charts (ramp) ── */
.chart{display:flex;align-items:flex-end;gap:26px;height:210px;padding:26px 8px 0;border-bottom:1px solid var(--line2);margin:8px 0 6px;overflow-x:auto}
.cgroup{flex:1;min-width:64px;display:flex;align-items:flex-end;justify-content:center;gap:4px;height:100%;position:relative}
.cbar{width:26px;border-radius:4px 4px 0 0;position:relative;min-height:2px}
.cbar.proj{background:var(--blue)}
.cbar.real{background:var(--green2)}
.cbar .bl{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:600;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.cxlbl{display:flex;gap:26px;padding:5px 8px 0;font-size:10.5px;color:var(--ink3)}
.cxlbl span{flex:1;min-width:64px;text-align:center}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink2);align-items:center;flex-wrap:wrap}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ── Modals ── */
.overlay{position:fixed;inset:0;background:rgba(16,18,34,.42);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:28px 16px}
.overlay.elev{z-index:120}
.modal{background:var(--bg);border-radius:14px;box-shadow:var(--sh2);width:100%;max-width:980px;display:flex;flex-direction:column;max-height:calc(100vh - 56px);position:relative}
.modal.sm{max-width:520px;background:var(--card)}
.modal .mhead{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card);border-radius:14px 14px 0 0;flex-wrap:wrap}
.modal .mhead .mt1{font-weight:800;font-size:15.5px;white-space:nowrap}
.modal .mhead .mt2{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px}
.modal .mhead .meta{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.modal .mhead .metachip{background:var(--muted);border-radius:5px;padding:2px 8px;font-size:12px;white-space:nowrap}
.modal .mclose{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:15px}
.modal .mclose:hover{background:var(--muted);color:var(--ink)}
.modal .mbody{padding:16px 20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.modal .mbody>*{flex-shrink:0}
.modal .mfoot{display:flex;align-items:center;gap:9px;padding:13px 20px;border-top:1px solid var(--line);background:var(--card);border-radius:0 0 14px 14px}
.modal .mfoot .grow{flex:1}
.mtoc{position:sticky;top:-16px;z-index:5;display:flex;gap:5px;background:var(--bg);padding:8px 0 6px;margin:-8px 0 -4px;flex-wrap:wrap}
.mtoc button{font-size:11.5px;font-weight:600;color:var(--ink2);border:1px solid var(--line2);background:var(--card);border-radius:99px;padding:3px 11px}
.mtoc button:hover{color:var(--merc);border-color:var(--merc-line)}

/* ── Evidence blocks (Qualify anatomy) ── */
.eblock{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.eblock .eh{display:flex;align-items:center;gap:8px;padding:11px 14px 7px;font-weight:600;font-size:13.5px}
.eblock .eh .grow{flex:1}
.eblock .eb{padding:0 14px 12px}
.eblock .efoot{padding:8px 14px;font-size:11.5px;color:var(--ink3);border-top:1px solid var(--line)}
.eblock .eact{padding:9px 14px;border-top:1px solid var(--line);background:var(--raised);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mercsum{background:var(--merc-bg);border-radius:var(--r);overflow:hidden}
.mercsum .msb{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mercsum .msh{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
.mercsum p{font-size:13.5px;line-height:1.55}
.mstiles{display:flex;flex-wrap:wrap;gap:8px}
.mstile{flex:1;min-width:118px;border:1px solid #E3D2FF;border-radius:8px;padding:8px 11px;display:flex;flex-direction:column;gap:1px}
.mstile .l{font-size:11.5px;color:#1E1E1E;display:flex;gap:4px;align-items:center}
.mstile .v{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.mstile .c{font-size:10.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mercband{background:linear-gradient(to right,#EBDFFF 60%,#F3ECFE 100%);padding:11px 14px;display:flex;flex-direction:column;gap:8px}
.mercband .cap{font-size:11.5px;font-weight:700;color:var(--merc)}
.mercband .head{font-size:14px;font-weight:600}
.mercband ul{margin:0 0 0 17px;font-size:12.5px;color:var(--ink2)}
.mercband li{margin:2px 0}
.mercband .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.deriv .drow{display:flex;justify-content:space-between;gap:14px;padding:10px 14px;border-top:1px solid #F1F3F5;font-size:13.5px;align-items:baseline}
.deriv .drow:first-child{border-top:none}
.deriv .drow .dl b{display:block;font-weight:600}
.deriv .drow .dl span{font-size:11.5px;color:var(--ink3)}
.deriv .drow .dv{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;display:flex;align-items:baseline;gap:6px}
.deriv .drow .op{color:var(--ink3);font-weight:400}
.deriv .drow.tot{background:var(--muted);font-weight:700}
.scorebars .sb{display:grid;grid-template-columns:150px 1fr 120px;align-items:center;gap:12px;padding:8px 14px;border-top:1px solid #F1F3F5;font-size:12.5px}
.scorebars .sb:first-child{border-top:none}
.scorebars .sb .l{font-weight:600;color:var(--ink2)}
.scorebars .sb .ob{color:var(--ink3);font-variant-numeric:tabular-nums;font-size:12px}
.scorebars .track{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.scorebars .track i{display:block;height:100%;border-radius:99px;background:var(--bar-grad)}
.scorebars .sb .v{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.scorebars .sb.res{background:var(--muted)}
.share{display:flex;align-items:center;gap:8px}
.share .strack{width:56px;height:4px;border-radius:99px;background:var(--line);overflow:hidden;flex-shrink:0}
.share .strack i{display:block;height:100%;background:var(--bar-grad);border-radius:99px}
.share span{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.fitrow{display:flex;align-items:flex-start;gap:10px;padding:9px 14px;border-top:1px solid #F1F3F5}
.fitrow:first-child{border-top:none}
.fitrow .fi{font-size:14px;line-height:1.3;flex-shrink:0;width:18px;text-align:center}
.fitrow .fl2{flex:1;min-width:0}
.fitrow .ft{font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center}
.fitrow .fd{font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.45}
.vchip{display:inline-flex;align-items:center;gap:4px;border-radius:5px;padding:1px 8px;font-size:11px;font-weight:700}
.vchip.pass{background:var(--green-bg);color:var(--green)}
.vchip.watch{background:var(--warn-bg);color:var(--warn)}
.vchip.note{background:#ECEEF2;color:var(--ink2)}
.tline{padding:2px 14px 10px}
.tline .te{display:flex;gap:10px;padding:7px 0;border-top:1px solid #F1F3F5;font-size:12.5px}
.tline .te:first-child{border-top:none}
.tline .dot{width:8px;height:8px;border-radius:50%;background:var(--ink4);margin-top:5px;flex-shrink:0}
.tline .dot.merc{background:var(--merc)}
.tline .dot.green{background:var(--green)}
.tline .dot.red{background:var(--red)}
.tline .tw{color:var(--ink2)}
.tline .tw b{color:var(--ink);font-weight:600}
.tline .td2{font-size:11px;color:var(--ink3);margin-top:1px}

/* ── Forms ── */
.field{display:flex;flex-direction:column;gap:5px;min-width:170px;flex:1}
.field label{font-size:12px;font-weight:600;color:var(--ink2)}
.field input,.field select,.field textarea{border:1px solid var(--line2);border-radius:9px;padding:8px 11px;font-size:13px;background:var(--card);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--merc)}
.field .help{font-size:11px;color:var(--ink3)}
.field .err{font-size:11px;color:var(--red)}
.field input.invalid{border-color:var(--red)}
.frow2{display:flex;gap:12px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;width:fit-content}
.seg button{padding:6px 16px;font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--card)}
.seg button.on{background:var(--indigo);color:#fff}

/* ── Act / playbook ── */
.appr{display:flex;gap:9px;flex-wrap:wrap}
.appr button{flex:1;min-width:170px;display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line2);border-radius:9px;padding:10px 12px;background:var(--card)}
.appr button.on{background:var(--merc-bg);border-color:#8C5DE1}
.appr .al{font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.appr .rec{flex-shrink:0;background:var(--merc-chip);color:var(--merc);border-radius:5px;padding:1px 7px;font-size:10px;font-weight:700}
.appr .as{font-size:11px;color:var(--ink3);line-height:1.4}
.task{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.task:first-child{border-top:none}
.task .tk{width:17px;height:17px;border-radius:50%;border:2px solid var(--ink4);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.task.done .tk{background:var(--green);border-color:var(--green)}
.task.done .tt{color:var(--ink3);text-decoration:line-through}
.task .tt{font-size:13px}
.drafttag{display:inline-flex;width:fit-content;align-items:center;gap:5px;background:var(--warn-bg);color:var(--warn);border-radius:5px;padding:2px 9px;font-size:11px;font-weight:700}
textarea.draft{width:100%;border:1px solid var(--line2);border-radius:9px;padding:10px 12px;font-family:var(--mono);font-size:11.5px;line-height:1.55;background:var(--card);min-height:180px;resize:vertical}

/* ── Tracking ── */
.riskband{display:flex;align-items:flex-start;gap:10px;border-radius:10px;padding:11px 14px;font-size:12.5px}
.riskband.ok{background:var(--green-bg);color:#14532D}
.riskband.warn{background:var(--warn-bg);color:#6B5310}
.riskband.bad{background:var(--red-bg);color:#7A2222}
.riskband b{display:block;font-size:13px;margin-bottom:1px}
.riskband .acts{margin-left:auto;display:flex;gap:7px;flex-shrink:0;flex-wrap:wrap}
.progress{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--green2);border-radius:99px}

/* ── Ask Mercer dock ── */
.mercdock{position:fixed;top:0;right:0;bottom:0;width:390px;background:var(--card);border-left:1px solid var(--line);box-shadow:-8px 0 28px rgba(20,22,50,.08);z-index:90;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .18s ease}
.mercdock.on{transform:translateX(0)}
.mercdock .mdh{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.mercdock .ctx{font-size:11px;font-weight:700;background:var(--merc-bg);color:var(--merc);border-radius:99px;padding:2px 10px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mercdock .msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;border-radius:11px;padding:9px 12px;font-size:13px;line-height:1.5}
.msg.user{align-self:flex-end;background:var(--indigo);color:#fff}
.msg.mercer{align-self:flex-start;background:var(--merc-bg);border:1px solid var(--merc-line)}
.msg .cites{margin-top:7px;padding-top:6px;border-top:1px dashed var(--merc-line);font-size:11px;color:var(--ink3)}
.msg .cites b{color:var(--merc);font-weight:700}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.sugg button{font-size:11.5px;font-weight:600;color:var(--merc);background:var(--merc-bg);border:1px solid var(--merc-line);border-radius:99px;padding:4px 11px;text-align:left}
.sugg button:hover{background:var(--merc-chip)}
.mercin{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.mercin input{flex:1;border:1px solid var(--line2);border-radius:9px;padding:8px 12px;font-size:13px;outline:none}
.mercin input:focus{border-color:var(--merc)}

/* ── Explain popover ── */
.expop{position:fixed;z-index:200;width:330px;background:var(--card);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--sh2);padding:13px 15px;font-size:12.5px}
.expop .xt{font-weight:700;font-size:13px;margin-bottom:5px;display:flex;justify-content:space-between;gap:8px}
.expop .xf{font-family:var(--mono);font-size:11.5px;background:var(--muted);border-radius:7px;padding:7px 10px;margin:6px 0}
.expop .xp{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:var(--ink2)}
.expop .xp b{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.expop .xl{font-size:11px;color:var(--ink3);margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.expop .xgo{margin-top:8px}

/* ── Toasts ── */
#toasts{position:fixed;left:80px;bottom:18px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:9px;background:var(--ink);color:#fff;border-radius:10px;padding:10px 15px;font-size:13px;font-weight:500;box-shadow:var(--sh2);max-width:440px}
.toast.success{background:#0E5A31}
.toast.info{background:var(--indigo)}
.toast .tlink{color:#CFC6FF;font-weight:700;cursor:pointer;white-space:nowrap}
.toast .tlink:hover{text-decoration:underline}

/* ── Empty states ── */
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:44px 20px;text-align:center}
.empty .ei{width:46px;height:46px;border-radius:12px;background:var(--merc-bg);color:var(--merc);display:flex;align-items:center;justify-content:center;font-size:21px}
.empty .ei.green{background:var(--green-bg);color:var(--green)}
.empty .et{font-weight:700;font-size:15px}
.empty .ed{font-size:12.5px;color:var(--ink3);max-width:380px}

/* ── Demo controls ── */
.demochip{position:fixed;right:16px;bottom:16px;z-index:85;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.demochip .dbtn{background:var(--ink);color:#fff;border-radius:99px;padding:7px 15px;font-size:12px;font-weight:700;box-shadow:var(--sh2);opacity:.82}
.demochip .dbtn:hover{opacity:1}
.demomenu{background:var(--card);border:1px solid var(--line2);border-radius:11px;box-shadow:var(--sh2);padding:7px;display:flex;flex-direction:column;gap:2px;min-width:230px}
.demomenu button{text-align:left;font-size:12.5px;font-weight:600;padding:7px 10px;border-radius:8px;color:var(--ink2)}
.demomenu button:hover{background:var(--muted);color:var(--ink)}
.demomenu .dnote{font-size:10.5px;color:var(--ink3);padding:4px 10px 5px;border-top:1px solid var(--line);margin-top:3px}
.main.mercer-open .demochip{right:406px}

.flash-param{animation:flashp 1.6s ease}
@keyframes flashp{0%{background:var(--merc-bg)}100%{background:transparent}}
.hi{color:var(--merc);font-weight:700}
</style>
</head>
<body>

  <nav class="rail" aria-label="Modules">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="M7 13l3.5-4 3 2.5L18 6"/><path d="M14.5 6H18v3.5"/></svg>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   NAVANTA LENS · PROTOTYPE v2 — DATA
   Mirrors the DEPLOYED build's live API data (allison-procurement-931u
   .vercel.app, pulled 2026-07-02): the same 7 opportunities, the same
   engine figures, the same vendor names — so this prototype diffs 1:1
   against the build. Every displayed number derives from these records;
   nothing is restated per screen. Self-checks at the bottom assert the
   tie-outs (Σ mid = $120,916.17 = the live cockpit's identifiedValueMid).
   ═══════════════════════════════════════════════════════════════════════ */

const RUN = {
  scanDate: "2026-07-01",
  sweepTime: "04:00",
  lastSeen: "2026-06-30T04:00:00",   // last sweep the CM reviewed → new/changed chips
  paramsVersion: "v1.2",
};

/* Engine parameters — the same registry /api/parameters serves.
   sec: A.3 Scan scoring · A.4 Vendor tiers · A.5 Opportunity generation ·
   A.6 Savings rates · A.7 Benchmark · A.8 Maverick & tail */
const PARAMS = [
  { key:"feas_frag_weight", sec:"A.3", label:"Feasibility: fragmentation weight", value:0.5, unit:"weight", def:0.5,
    desc:"Share of a category's Feasibility score driven by how fragmented its supplier base is. Pairs with the cross-division weight; the two sum to 1.0." },
  { key:"feas_xbu_weight", sec:"A.3", label:"Feasibility: cross-division weight", value:0.5, unit:"weight", def:0.5,
    desc:"Share of Feasibility driven by overlapping AT + AOH demand (cross-BU leverage potential)." },
  { key:"prov_exponent", sec:"A.3", label:"Provability weighting (exponent)", value:2, unit:"exponent", def:2,
    desc:"Scan score = Prize × Feasibility × Provability^(this). 2 squares provability so well-evidenced categories rank far above speculative ones — the engagement is outcome-based." },
  { key:"scan_xbu_norm_min_spend", sec:"A.3", label:"Cross-BU normalization floor", value:1000000, unit:"usd", def:1000000,
    desc:"Minimum category spend used when normalizing the cross-BU overlap signal, so small categories don't over-index." },
  { key:"tier_keep_min_spend", sec:"A.4", label:"Tier: Keep — min annual spend", value:500000, unit:"usd", def:500000,
    desc:"Vendors at or above this annual spend (or ≥ the segment floor) are tiered Keep." },
  { key:"tier_keep_min_segments", sec:"A.4", label:"Tier: Keep — min segments served", value:5, unit:"count", def:5,
    desc:"Serving this many sub-category segments also qualifies a vendor as Keep." },
  { key:"tier_leverage_min_spend", sec:"A.4", label:"Tier: Leverage — min annual spend", value:100000, unit:"usd", def:100000,
    desc:"Vendors between this floor and the Keep floor are tiered Leverage (negotiate, don't exit)." },
  { key:"tier_consolidate_min_spend", sec:"A.4", label:"Tier: Consolidate — min annual spend", value:25000, unit:"usd", def:25000,
    desc:"Vendors between this floor and the Leverage floor fold into an anchor; below it, Exit-tail." },
  { key:"pocket_min_spend", sec:"A.5", label:"Pocket materiality — min spend", value:300000, unit:"usd", def:300000,
    desc:"An L3 × country pocket must hold at least this much spend to surface as an opportunity." },
  { key:"pocket_min_vendors", sec:"A.5", label:"Pocket materiality — min vendors", value:4, unit:"count", def:4,
    desc:"…and at least this many vendors (fewer means there's nothing to consolidate or compete)." },
  { key:"winner_share_consolidate", sec:"A.5", label:"Lever routing — winner share threshold", value:0.5, unit:"share", def:0.5,
    desc:"If the top non-OEM vendor holds ≥ this share of the pocket, the lever is Consolidate (movable = pocket − winner − OEM); otherwise Competitive RFP (movable = pocket − OEM)." },
  { key:"confidence_gap_cap", sec:"A.5", label:"Confidence — fragmentation gap cap", value:20, unit:"count", def:20,
    desc:"Vendor-count gap is capped here in the confidence multiplier — beyond it, more fragmentation no longer lifts confidence." },

/* ── Roster builder: named head + deterministic tail that closes the sum
      exactly, so Σ roster = pocket to the cent on every opportunity. ── */
const TAIL_NAMES = ["Summit Fasteners","Northgate Abrasives","Cardinal Packaging","Lakeshore Bearings","Vertex Coatings","Redline Hydraulics","Beacon Electrical","Harbor Janitorial","Stonebridge Filters","Quarry Safety","Elmwood Gaskets","Torrent Pumps","Bright Bay Lubes","Keystone Valves","Orchard Solvents","Granite Tooling","Fairfield Hose","Maple City Welding","Ridgeview Chemical","Clearwater Seals","Ironwood Fittings"];
function buildRoster(named, tailCount, tailTotal, seed) {
  const roster = named.map(v => ({ ...v }));
  if (tailCount > 0) {
    const weights = []; let wsum = 0;
    for (let i = 0; i < tailCount; i++) { const w = 1 / (i + 2.2); weights.push(w); wsum += w; }
    let assigned = 0;
    for (let i = 0; i < tailCount; i++) {
      const isLast = i === tailCount - 1;
      const amt = isLast ? +(tailTotal - assigned).toFixed(2) : +((tailTotal * weights[i] / wsum)).toFixed(2);
      assigned = +(assigned + amt).toFixed(2);
      roster.push({ n: "Supplier " + TAIL_NAMES[(seed + i) % TAIL_NAMES.length], s: amt, cap: null });
    }
  }
  return roster;
}

  ];
}
function dcScore(breakdown){ return Math.round(breakdown.reduce((s,c)=>s+c.weight*c.score,0)); }

  return { dims, score: Math.round(dims.reduce((s,d)=>s+d.weight*d.score,0)) };
}

/* ── Formatters (ported 1:1 from the build's lib/format.ts) ── */
const nf = (n) => Math.round(n).toLocaleString("en-US");

function fmtK(n){ return `${n<0?"-":""}$${nf(Math.abs(n)/1e3)}K`; }
function fmtC(n){ const a=Math.abs(n);
  if(a>=1e7) return fmtM(n);
  if(a>=1e6){ const s=(a/1e6).toFixed(2).replace(/0$/,"").replace(/\.0$/,""); return `${n<0?"-":""}$${s}M`; }
  if(a>=1e3) return fmtK(n);

function fmtRange(lo,hi){ return `${fmtC(lo)}–${fmtC(hi)}`; }

function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

      this. An operator override flows everywhere identically (audit F3/H5). ── */
function resolveSavings(o){
  const baseA = o.movable, baseLoP = baseA>0 ? o.savLo/baseA*100 : 0, baseHiP = baseA>0 ? o.savHi/baseA*100 : 0;
  const spread = Math.max(0, baseHiP-baseLoP);
  const ovA = o.ovA!=null && o.ovA>0, ovP = o.ovP!=null && o.ovP>0;
  const addr = ovA ? o.ovA : baseA;
  const loP = ovP ? o.ovP : baseLoP, hiP = ovP ? loP+spread : baseHiP;
  const overridden = ovA||ovP;
  const lo = overridden ? Math.round(addr*loP/100) : o.savLo;
  const hi = overridden ? Math.round(addr*hiP/100) : o.savHi;
  return { addr, lo, hi, mid:(lo+hi)/2, loP, hiP, basis: overridden?"override":"workbook", baseLo:o.savLo, baseHi:o.savHi, baseA, baseLoP, baseHiP };
}

/* ── Popover / toast / util ── */
function openExplain(key, oppId, anchor){
  closeExplain();
  const spec = EXPLAINS[key] ? EXPLAINS[key](oppId?oppById(oppId):null) : null;
  if(!spec) return;
  const root = document.getElementById("popover-root");
  const pop = document.createElement("div");
  pop.className = "expop"; pop.setAttribute("role","dialog");
  pop.innerHTML = `
    <div class="xt"><span>${esc(spec.title)}</span><button class="mclose" data-act="close-explain" aria-label="Close" style="width:22px;height:22px">✕</button></div>
    <div class="xf">${esc(spec.formula)}</div>
    ${spec.params.map(p=>`<div class="xp"><span>${esc(p.l)}</span><b>${esc(p.v)}${p.link?` <button class="linkbtn" data-act="goto-param" data-param="${p.link}" style="font-size:10.5px">dial ↗</button>`:""}</b></div>`).join("")}
    <div class="xl">${esc(spec.lineage)}</div>
    <div class="xgo"><button class="linkbtn" data-act="explain-methodology">View in Methodology →</button> <button class="linkbtn" data-act="explain-ask" data-key="${key}" data-opp="${oppId||""}">Ask Mercer to narrate</button></div>`;
  root.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  const W = 330, margin = 10;
  let left = Math.min(window.innerWidth - W - margin, Math.max(margin, r.left - 40));
  let top = r.bottom + 8;
  pop.style.left = left+"px";
  requestAnimationFrame(()=>{ const h = pop.offsetHeight; if(top+h > window.innerHeight-margin) top = Math.max(margin, r.top - h - 8); pop.style.top = top+"px"; });
  pop.style.top = top+"px";
}
function closeExplain(){ document.getElementById("popover-root").innerHTML=""; }

let toastSeq = 0;
function toast(msg, kind, linkLabel, linkGo){
  const id = "t"+(++toastSeq);
  const t = document.createElement("div");
  t.className = "toast "+(kind||"info"); t.id = id;
  t.innerHTML = `<span>${esc(msg)}</span>${linkLabel?`<span class="tlink" data-act="toast-go" data-go="${linkGo}">${esc(linkLabel)}</span>`:""}`;
  document.getElementById("toasts").appendChild(t);
  setTimeout(()=>{ t.style.opacity="0"; t.style.transition="opacity .3s"; setTimeout(()=>t.remove(),320); }, 4600);
}

/* ── Data-freshness stamp (audit H1) ── */
function stamp(extra){
  return `<div class="stamp">Data as of <b>${fmtDate(RUN.scanDate)}</b> · sweep ${RUN.sweepTime} · parameters <b>${S.mVersion}</b>${extra?` · ${extra}`:""}</div>`;

/* ── Render dispatch ── */
function render(){
  renderTopbar(); renderRail();
  const c = document.getElementById("content");
  /* A dead data service takes down EVERY data screen the same way — an error
     is an error wherever you navigate, never a quietly wrong page. */
  if(S.dataError) c.innerHTML = renderDataError();
  else if(S.screen==="dashboard") c.innerHTML = renderDashboard();
  else if(S.screen==="feed") c.innerHTML = renderFeed();
  else if(S.screen==="tracking") c.innerHTML = renderTracking();
  else if(S.screen==="vendors") c.innerHTML = renderVendors();
  else if(S.screen==="methodology") c.innerHTML = renderMethodology();
  renderModals(); renderMercer(); renderDemo();
}

  return `<div class="screen">

      <div style="flex:1"><b>Couldn't load ${SCREEN_TITLES[S.screen]}</b>
      The data service returned an error (HTTP 500). This is a failure, not an empty result — figures are hidden rather than shown as zeros, and cached numbers are never silently substituted.

      <span style="font-size:11px;color:#7A2222;margin-left:8px">Toggled from the Demo menu — this is the designed failure state, distinct from loading.</span></div></div>

/* Row-resolve choreography (IRIS): flash, fade, drop. */
function beginResolve(id, kind){
  S.resolving.set(id, { kind, phase:"resolved" });
  render();
  setTimeout(()=>{ const e=S.resolving.get(id); if(!e) return; e.phase="fading"; render(); }, 1400);

      <div class="pb tight tblwrap"><table class="tbl">
        <thead><tr>
          ${S.tab==="feed"?`<th style="width:34px"><input type="checkbox" data-act="sel-all" ${rows.length>0&&rows.every(o=>S.sel.has(o.id))?"checked":""} aria-label="Select all"></th>`:""}
          <th>#</th><th>Opportunity</th><th>Sub-category</th><th>Country</th><th>Lever</th>
          ${sortTh("pocket","Total spend")}${sortTh("movable","Addressable")}
          <th class="num">Vendors</th>${sortTh("conf","Confidence")}${sortTh("savings","Savings")}
        </tr></thead>
        <tbody>${rows.map((o,i)=>feedRow(o,i)).join("")}</tbody>
      </table></div>`}
    </div>
  </div>`;
}
function sortTh(key,label){
  const on = S.sort===key;
  return `<th class="num sortable" data-act="sort-col" data-key="${key}">${label} ${on?`<span class="arr">${S.sortDir==="desc"?"▼":"▲"}</span>`:""}</th>`;
}
function feedRow(o,i){
  const r = resolveSavings(o);
  const res = S.resolving.get(o.id);
  const cls = res ? (res.kind==="committed"?"row-resolved":"row-dismissed")+(res.phase==="fading"?" row-fading":"") : "";
  const flags = [];
  if (S.tab==="feed" && isNewSince(o)) flags.push(`<span class="chip new" title="${esc(o.newSignal||"Surfaced since your last sweep")}">✦ New</span>`);
  if (S.tab==="feed" && isChangedSince(o)) flags.push(`<span class="chip changed" title="${esc(o.changed.note)}">Δ Changed</span>`);
  if (o.caveats && o.caveats.length && S.tab!=="rejected") flags.push(`<span class="chip flag" title="${esc(o.caveats[0])}">Upper bound</span>`);
  if (o.bu==="Both") flags.push(`<span class="chip both" title="Both AT and AOH buy in this pocket — cross-division synergy">Cross-BU</span>`);
  const sub = S.tab==="rejected" && o.rejectReason ? `<span class="sub">Rejected · ${esc(o.rejectReason)}</span>`
    : S.tab==="parked" && o.parkTrigger ? `<span class="sub">Revisit: ${esc(o.parkTrigger)}</span>`
    : S.tab==="act" ? `<span class="sub">Approved — run the play to commit</span>` : "";
  return `<tr class="rowlink ${cls}" data-act="open-opp" data-id="${o.id}">
    ${S.tab==="feed"?`<td data-act="sel-row" data-id="${o.id}"><input type="checkbox" data-act="sel-row" data-id="${o.id}" ${S.sel.has(o.id)?"checked":""} aria-label="Select ${o.id}"></td>`:""}
    <td style="color:var(--ink3);font-variant-numeric:tabular-nums">${i+1}</td>
    <td><b>${esc(o.l3)}</b> <span style="color:var(--ink3);font-size:11.5px">${o.id}</span><br>${flags.join(" ")}${sub}</td>
    <td>${esc(o.l2)}</td><td>${esc(o.country)}</td><td>${leverPill(o)}</td>
    <td class="num">${fmtC(o.pocket)}</td>
    <td class="num">${fmtC(r.addr)}${r.basis==="override"?` <span class="chip new" title="Operator override — workbook was ${fmtC(o.movable)}">ovr</span>`:""}</td>
    <td class="num">${o.vendorCount}</td>
    <td class="num">${confMeter(o,"sm",true)}</td>
    <td class="num">${fmtRange(r.lo,r.hi)}</td>
  </tr>`;
}
function emptyFeedState(){
  const anyFilter = S.f.q||S.f.l2||S.f.lever||S.f.country||S.f.hiconf;
  if (S.tab==="feed" && !anyFilter && feedOpps().length===0){
    const live = trackedOpps().filter(o=>o.live).length;
    return `<div class="empty"><div class="ei green">✓</div>
      <div class="et">Feed clear — every opportunity triaged</div>
      <div class="ed">Mercer's next sweep runs at ${RUN.sweepTime}. ${live?`${live} ${live===1?"play is":"plays are"} live in execution.`:""}</div>
      <button class="btn sm pri" data-act="nav" data-go="tracking">View committed plays in Value Realization</button></div>`;
  }
  if (anyFilter) return `<div class="empty"><div class="ei">◫</div><div class="et">No opportunities match</div>
    <div class="ed">Widen the filters or clear the search to see more of the sweep.</div>
    <button class="btn sm" data-act="clear-filters">Clear all filters</button></div>`;
  return `<div class="empty"><div class="ei">◫</div><div class="et">Nothing here yet</div>
    <div class="ed">${S.tab==="act"?"Approve an opportunity in the feed to stage its play here.":S.tab==="parked"?"Parked buckets wait here until their revisit trigger fires.":"Rejected buckets stay visible here — each carries its reason, and Mercer's fit screen learns from them."}</div></div>`;
}
</script>
<script>
/* ═══ QUALIFY — evidence anatomy. Confidence math is WIRED IN (audit N1);
       approve is guarded; every figure explains itself. ═══ */

const MAX_ROSTER = 8;
S.rosterExpanded = false;
S.fitDetail = false;

function renderQualify(o){
  const r = resolveSavings(o);
  const isTracked = TRACKED_ST.has(o.status), isRej = o.status==="rejected", isParked = o.status==="parked";
  const editable = !isTracked && !isRej && !isParked && o.status!=="accepted";
  const rateWord = r.addr>0 ? `${Math.round(r.lo/r.addr*100)}–${Math.round(r.hi/r.addr*100)}% of addressable` : "estimated";
  const confWord = band(o.conf).word;

  /* Swappable action band under the summary (IRIS pattern). */
  let bandHtml;
  if (isTracked) bandHtml = `<div style="padding:0 12px 12px"><div class="riskband ok">✓<div><b>Committed · in Value Realization</b>${fmtRange(r.lo,r.hi)} target · ${STATUS_LABELS[o.status]} · owner ${esc(o.committed?.by||"—")}</div></div></div>`;
  else if (isRej) bandHtml = `<div style="padding:0 12px 12px"><div class="riskband bad">✕<div><b>Rejected · ${esc(o.rejectReason||"screened out")}</b>Logged for sweep calibration — stays visible under Rejected.</div></div></div>`;
  else if (isParked) bandHtml = `<div style="padding:0 12px 12px"><div class="riskband warn">⏸<div><b>Parked · revisit: ${esc(o.parkTrigger||"later")}</b>Resurfaces when its trigger fires.</div></div></div>`;
  else if (S.overrideOpen) bandHtml = overrideBand(o,r);
  else bandHtml = `<div class="mercband">
      <span class="cap">Mercer recommends · Confidence ${confWord} (${Math.min(CONF_CEILING,o.conf)}%)</span>
      <span class="head">${esc(o.action)}</span>
      <ul>${o.rationale.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      ${editable?`<div class="acts">
        <button class="btn christy sm" data-act="mercer-about-opp">✦ Ask Mercer about this</button>
        <button class="btn sm" data-act="toggle-input">${S.inputOpen?"Hide context":"Add context"}</button>
        <button class="btn sm" data-act="open-override">Override figures</button>
        <button class="btn christy sm" data-act="approve" ${S.overrideOpen||inputDirty(o)?"disabled":""} title="${S.overrideOpen?"Apply or cancel your override first":inputDirty(o)?"Save or discard your input first":""}">✓ Approve</button>
      </div>`:""}</div>`;

  const body = `
    <div class="mtoc" role="navigation" aria-label="Sections">
      ${[["q-sum","Summary"],["q-math","Math"],["q-roster","Roster"],["q-fit","Fit"],["q-deriv","Derivation"],["q-hist","History"]]
        .map(([id,l])=>`<button data-act="toc" data-target="${id}">${l}</button>`).join("")}
    </div>

    <div class="mercsum" id="q-sum">
      <div class="msb">
        <div class="msh"><svg class="star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8L12 2z"/></svg> Mercer Summary</div>
        <p>${esc(o.mercerSummary)}</p>
        <div class="mstiles">
          <div class="mstile"><span class="l">Total spend</span><span class="v">${fmtC(o.pocket)}</span><span class="c">in this pocket</span></div>
          <div class="mstile"><span class="l">Addressable <button class="info" data-act="explain" data-key="addressable" data-opp="${o.id}" aria-label="How addressable is derived">i</button></span><span class="v">${fmtC(r.addr)}</span><span class="c">upper bound · contestable</span></div>
          <div class="mstile"><span class="l">Savings potential <button class="info" data-act="explain" data-key="savings" data-opp="${o.id}" aria-label="How the savings range is derived">i</button></span><span class="v">${fmtRange(r.lo,r.hi)}</span><span class="c">${rateWord}${r.basis==="override"?" · your override":""}</span></div>
          <div class="mstile"><span class="l">Confidence</span><span class="v">${Math.min(CONF_CEILING,o.conf)}% · ${confWord}</span><span class="c">${o.analystAdjusted?"analyst-adjusted":"formula-scored"}</span></div>
        </div>
      </div>
      ${bandHtml}
    </div>

    ${editable && S.inputOpen ? yourInputCard(o) : ""}

    ${o.caveats.map(c=>`<div class="caveat"><b>Data caveat</b>${esc(c)}</div>`).join("")}

    <!-- What drove this — the confidence math, IN the flow (audit N1) -->
    <div class="eblock" id="q-math">
      <div class="eh">∑ What drove this · confidence math <div class="grow"></div>
        <span style="font-size:11px;color:var(--ink3);font-family:var(--mono)">confidence = fit × MIN(gap, ${prm("confidence_gap_cap")}) / ${prm("confidence_gap_cap")}</span></div>
      <div class="eb" style="padding:0"><div class="scorebars">${confMathRows(o)}</div></div>
      <div class="efoot">${o.gap>=prm("confidence_gap_cap")?`Gap is capped at ${prm("confidence_gap_cap")}× — beyond that, more fragmentation no longer lifts confidence. `:""}Confidence is independent of $ size — a small clean play outranks a huge messy one. That's why ranking uses Impact (addressable × confidence), declared above the feed.</div>
    </div>

    <!-- Vendor roster — share of POCKET (one denominator, audit F2) -->
    <div class="eblock" id="q-roster">
      <div class="eh">⌂ Vendor roster · this pocket <div class="grow"></div><span style="font-size:11px;color:var(--ink3)">Σ shares = 100% of pocket</span></div>
      <div class="eb tblwrap" style="padding:0"><table class="tbl">
        <thead><tr><th>Vendor</th><th class="num">Spend</th><th class="num">AT</th><th class="num">AOH</th><th>Share of pocket</th><th>Capability</th></tr></thead>
        <tbody>${rosterRows(o)}</tbody></table></div>
      ${o.roster.length>MAX_ROSTER?`<div class="efoot"><button class="linkbtn" data-act="toggle-roster">${S.rosterExpanded?"Show fewer":"Show all "+o.roster.length+" vendors"}</button></div>`:""}
    </div>

    ${o.lever==="rfp"?biddersBlock(o):""}

    <div class="eblock" id="q-fit">
      <div class="eh">✓ Functional fit <div class="grow"></div>
        <button class="linkbtn" data-act="toggle-fit" aria-expanded="${S.fitDetail}">${S.fitDetail?"Hide reasoning ▴":"Show reasoning ▾"}</button></div>
      <div class="eb" style="padding:0">${Object.values(o.functionalFit).map((d,i)=>`
        <div class="fitrow"><span class="fi">${d.verdict==="pass"?"✓":d.verdict==="watch"?"⚠":"ℹ"}</span>
          <div class="fl2"><div class="ft"><span>${esc(d.label)}</span><span class="vchip ${d.verdict==="pass"?"pass":d.verdict==="watch"?"watch":"note"}">${d.verdict==="pass"?"Fits":d.verdict==="watch"?"Watch":"Note"}</span></div>
          ${S.fitDetail?`<div class="fd">${esc(d.detail)}</div>`:""}</div></div>`).join("")}
      </div>
    </div>

    <!-- Payment-terms benchmark: COMPUTED from the roster's real terms data;
         staged only for the vendors that genuinely have none. -->
    ${termsBlock(o)}

    ${isTracked?"":`
    <div class="eblock deriv" id="q-deriv">
      <div class="eh">$ How we got there · savings derivation</div>
      <div class="eb" style="padding:0">
        <div class="drow"><span class="dl"><b>Pocket spend</b><span>L3 × country</span></span><span class="dv">${fmtUSD(o.pocket)}</span></div>
        ${o.exclusions.map(e=>`<div class="drow"><span class="dl"><b>${esc(e.label)}</b><span>${esc(e.reason)}</span></span><span class="dv"><span class="op">−</span>${fmtUSD(e.amount)}</span></div>`).join("")}
        <div class="drow tot"><span class="dl"><b>Addressable</b><span>upper bound · contestable spend</span></span><span class="dv">${fmtUSD(r.addr)}${r.basis==="override"?` <span class="chip new">override</span>`:""}</span></div>
        <div class="drow"><span class="dl"><b>Conservative outcome (${Math.round(r.loP)}%)</b></span><span class="dv">${fmtUSD(r.lo)}</span></div>
        <div class="drow"><span class="dl"><b>Stretch outcome (${Math.round(r.hiP)}%)</b></span><span class="dv">${fmtUSD(r.hi)}</span></div>
        <div class="drow tot"><span class="dl"><b>Savings range</b></span><span class="dv">${fmtRange(r.lo,r.hi)}</span></div>
      </div>
      <div class="efoot">${r.basis==="override"
        ?`Pocket → carve-outs are the engine's figures; the range reflects <b style="color:var(--merc)">your override</b> — workbook baseline was ${fmtRange(r.baseLo,r.baseHi)}.`
        :`Pocket → carve-outs → addressable are the engine's figures; the range applies the lever's conservative–stretch rates (${LEVER_LABELS[o.lever]}) to addressable.`}
        <button class="linkbtn" data-act="goto-param" data-param="savings_rate.${o.lever==="consolidate"?"consolidate_incumbent":"competitive_rfp"}">rate dial ↗</button></div>
    </div>`}

    <div class="eblock" id="q-hist">
      <div class="eh">◷ How this surfaced &amp; what happened since</div>
      <div class="tline">${o.events.map(e=>`
        <div class="te"><span class="dot ${e.actor==="Mercer"?(e.kind==="drift-flagged"?"red":"merc"):e.kind==="committed"?"green":""}"></span>
          <div><div class="tw"><b>${esc(e.actor)}</b> ${eventPhrase(e.kind)}</div><div class="td2">${fmtDay(e.at)}${e.note?` · ${esc(e.note)}`:""}</div></div></div>`).join("")}
      </div>
    </div>`;

  const footer = isTracked
    ? `<button class="btn christy" data-act="mercer-about-opp">✦ Ask Mercer about this</button><div class="grow"></div><button class="btn" data-act="goto-tracking-opp">View in Value Realization ↗</button>`
    : (isRej||isParked)
    ? `<button class="btn christy" data-act="mercer-about-opp">✦ Ask Mercer about this</button><div class="grow"></div>
       ${isParked?`<button class="btn pri" data-act="unpark">Return to feed</button>`:""}
       <button class="btn" data-act="close-panel">Close</button>`
    : o.status==="accepted"
    ? `<div class="grow"></div><button class="btn pri" data-act="open-act">Run the play →</button>`
    : `<div class="grow"></div>
       <button class="btn" data-act="req-reject">Reject</button>
       <button class="btn" data-act="req-park">Park</button>
       <button class="btn christy" data-act="approve" ${S.overrideOpen||inputDirty(o)?"disabled":""} title="${S.overrideOpen?"Apply or cancel your override first":inputDirty(o)?"Save or discard your input first":""}">✓ Approve</button>`;

  return modalShell("qualify", o.id, o.l3+" · "+o.country, `
      <span class="metachip">${esc(o.l2)} · ${esc(o.country)}</span>
      ${buChip(o.bu)}
      <span class="chip ev">${o.basis==="evidence"?"Evidence":o.basis==="benchmark"?"Benchmark":"Mixed"}</span>
      ${confMeter(o,"md",true)}`,
    body, footer);
}

function confMathRows(o){
  const cap = prm("confidence_gap_cap");
  const gapMult = Math.min(o.gap,cap)/cap;
  const formulaConf = Math.round(o.fit*gapMult*100);
  let rows = `
    <div class="sb"><span class="l">Functional fit</span><span class="ob">${o.fit.toFixed(2)} <span class="track" style="display:inline-block;width:60px;vertical-align:middle;margin-left:6px"><i style="width:${o.fit*100}%"></i></span></span><span class="v">× ${o.fit.toFixed(2)}</span></div>
    <div class="sb"><span class="l">Fragmentation multiplier</span><span class="ob">MIN(${o.gap}, ${cap}) / ${cap} <span class="track" style="display:inline-block;width:60px;vertical-align:middle;margin-left:6px"><i style="width:${gapMult*100}%"></i></span></span><span class="v">× ${gapMult.toFixed(2)}</span></div>`;
  if (o.analystAdjusted){
    rows += `<div class="sb"><span class="l">Sweep formula</span><span class="ob">${o.fit.toFixed(2)} × ${gapMult.toFixed(2)}</span><span class="v">= ${formulaConf}%</span></div>
      <div class="sb res"><span class="l"><b>Confidence</b></span><span class="ob">${esc(o.adjustNote||"analyst-adjusted — see rationale")}</span><span class="v"><b>${Math.min(CONF_CEILING,o.conf)}%</b></span></div>`;
  } else {
    rows += `<div class="sb res"><span class="l"><b>Confidence</b></span><span class="ob">${o.fit.toFixed(2)} × ${gapMult.toFixed(2)}</span><span class="v"><b>${Math.min(CONF_CEILING,o.conf)}%</b></span></div>`;
  }
  return rows;
}

function rosterRows(o){
  const shown = S.rosterExpanded ? o.roster : o.roster.slice(0, MAX_ROSTER);
  return shown.map(v=>{
    const share = v.s/o.pocket*100;
    return `<tr>
      <td><b>${esc(v.n)}</b> ${v.win?`<span class="chip anchor">★ Anchor</span>`:""} ${v.oem?`<span class="chip oem" title="OEM / sole-source — carved out of addressable; never the winner">OEM · carved out</span>`:""}</td>
      <td class="num">${fmtC(v.s)}</td>
      <td class="num" style="color:var(--ink3)">${v.at?fmtC(v.at):"—"}</td>
      <td class="num" style="color:var(--ink3)">${v.aoh?fmtC(v.aoh):"—"}</td>
      <td><span class="share"><span class="strack"><i style="width:${Math.min(100,share)}%"></i></span><span>${share.toFixed(1)}%</span></span></td>
      <td style="color:var(--ink2);font-size:12px;text-transform:capitalize">${v.cap||"—"}</td>
    </tr>`;}).join("");
}

function biddersBlock(o){
  const eligible = o.roster.filter(v=>!v.oem && v.s/o.pocket>=0.05).sort((a,b)=>b.s-a.s);
  const broad = eligible.filter(v=>v.cap==="broad-line");
  const picked = []; const seen = new Set();
  for (const v of [...broad, ...eligible]){ if(seen.has(v.n)) continue; seen.add(v.n); picked.push(v); if(picked.length>=5) break; }
  picked.sort((a,b)=>b.s-a.s);
  if(!picked.length) return "";
  const covered = picked.reduce((s,v)=>s+v.s,0)/o.pocket;
  return `<div class="eblock"><div class="eh">◎ Recommended bidders</div>
    <div class="eb"><div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">
      ${picked.map(v=>`<span class="chip" style="background:var(--merc-bg);color:var(--ink);font-weight:600">${esc(v.n)} <span style="color:var(--ink3)">${Math.round(v.s/o.pocket*100)}%</span>${v.cap==="broad-line"?` <span style="color:var(--merc);font-size:10px;font-weight:700">broad-line</span>`:""}</span>`).join("")}
    </div><p style="font-size:12px;color:var(--ink2)">${broad.length?"Broad-line suppliers can anchor the full consolidated scope; the rest are top incumbents for competitive tension":"Top incumbents by share — no broad-line supplier in this pocket, confirm full-scope coverage before issuing"} (~${Math.round(covered*100)}% of the pocket). OEM / sole-source excluded.</p></div></div>`;
}

/* Terms-vs-benchmark: joins the roster to the vendor record by name. Vendors
   WITH terms get the computable working-capital read now; only the genuinely
   terms-less remainder is staged. Never claims "no data" when data exists. */
const WC_COST_OF_CAPITAL = 0.08; // illustrative until treasury supplies it
function termsBlock(o){
  const target = prm("benchmark_terms_target");
  const byName = new Map(VENDORS.map(v=>[v.n,v]));
  const joined = o.roster.filter(rv=>!rv.oem).map(rv=>({ rv, v: byName.get(rv.n) })).filter(x=>x.v);
  const withTerms = joined.filter(x=>x.v.terms!=null);
  const missing = o.roster.filter(rv=>!rv.oem).length - withTerms.length;
  if (withTerms.length===0){
    return `<div class="eblock"><div class="eh">◔ Terms vs benchmark <span class="chip stage">Staged</span> <div class="grow"></div>
      <button class="info" data-act="explain" data-key="termsbench" aria-label="How the terms benchmark works">i</button></div>
      <div class="eb" style="font-size:12.5px;color:var(--ink2)">No payment-terms data on file for any vendor in this pocket — the working-capital benchmark (vs Net ${target}) computes as soon as the SAP <code style="font-family:var(--mono);font-size:11px">pay_terms</code> feed lands. Shown as staged, never faked.</div></div>`;
  }
  const rows = withTerms.map(({rv,v})=>{
    const gap = target - v.terms;
    const wc = gap>0 ? Math.round(rv.s * gap/365 * WC_COST_OF_CAPITAL) : 0;
    return { name:v.n, terms:v.terms, gap, wc, spend:rv.s };
  }).sort((a,b)=>b.wc-a.wc);
  const totalWc = rows.reduce((s,r2)=>s+r2.wc,0);
  return `<div class="eblock"><div class="eh">◔ Terms vs benchmark <span class="chip ok">Computable now</span> <div class="grow"></div>
    <button class="info" data-act="explain" data-key="termsbench" aria-label="How the terms benchmark works">i</button></div>
    <div class="eb tblwrap" style="padding:0"><table class="tbl">
      <thead><tr><th>Vendor</th><th class="num">Terms on file</th><th class="num">Gap to Net ${target}</th><th class="num">WC value in this pocket</th></tr></thead>
      <tbody>${rows.map(r2=>`<tr><td>${esc(r2.name)}</td><td class="num">Net ${r2.terms}</td>
        <td class="num">${r2.gap>0?`+${r2.gap}d`:"at/above target"}</td>
        <td class="num">${r2.wc>0?fmtUSD(r2.wc)+"/yr":"—"}</td></tr>`).join("")}</tbody></table></div>
    <div class="efoot">Extending the ${rows.filter(r2=>r2.gap>0).length} below-target vendor${rows.filter(r2=>r2.gap>0).length===1?"":"s"} to Net ${target} frees ≈${fmtUSD(totalWc)}/yr of working capital at an ${Math.round(WC_COST_OF_CAPITAL*100)}% cost of capital (illustrative). Terms for the remaining ${missing} roster vendor${missing===1?"":"s"} land with the SAP <code style="font-family:var(--mono);font-size:10.5px">pay_terms</code> feed — staged, never faked.</div></div>`;
}

function eventPhrase(kind){
  return { surfaced:"surfaced this opportunity", qualified:"assembled the evidence pack", committed:"committed the play",
    rejected:"rejected this opportunity", parked:"parked this opportunity", "stage-advanced":"advanced the stage",
    "drift-flagged":"flagged drift on this play", "drift-cleared":"cleared the drift", note:"added a note" }[kind] || kind;
}

function inputDirty(o){
  if(!S.inputDraft || S.inputDraftId!==o.id) return false;
  const d=S.inputDraft, u=o.userInput;
  return (d.context||"")!==(u.context||"") || (d.marketIntel||"")!==(u.marketIntel||"") || (d.vendorNotes||"")!==(u.vendorNotes||"");
}
function yourInputCard(o){
  const d = S.inputDraft && S.inputDraftId===o.id ? S.inputDraft : (S.inputDraft={context:o.userInput.context||"",marketIntel:o.userInput.marketIntel||"",vendorNotes:o.userInput.vendorNotes||""}, S.inputDraftId=o.id, S.inputDraft);
  const dirty = inputDirty(o);

<script>
/* ═══ VALUE REALIZATION — labeled midpoints (F6) · honest realized · drift
       with a real resolution flow · demo-SAP clearly badged ═══ */

function qSeq(startQ, startY, n){ const out=[]; let q=startQ,y=startY; for(let i=0;i<n;i++){ out.push(`Q${q} ${y}`); if(++q>4){q=1;y++;} } return out; }
const RAMP_QUARTERS = qSeq(3,2026,8);
function parseQ(s){ const m=/Q(\d) (\d{4})/.exec(s); return m?{q:+m[1],y:+m[2],idx:(+m[2])*4+(+m[1])}:null; }

function rampData(){
  const plays = trackedOpps();
  return RAMP_QUARTERS.map(qs=>{
    const qi = parseQ(qs).idx;
    let proj = 0, real = 0;
    plays.forEach(o=>{
      const start = parseQ(o.committed?.timing||"");
      if(start && qi>=start.idx && qi<start.idx+4) proj += resolveSavings(o).mid/4;
      (o.actuals||[]).forEach(a=>{ if(a.q===qs) real += a.amt; });
    });
    return { q:qs, proj, real };
  });
}

function renderTracking(){
  const plays = trackedOpps().filter(o=>{
    if(S.trackTab==="live") return o.live;
    if(S.trackTab==="notstarted") return !o.live && o.status!=="realized";
    return true;
  }).filter(o=>!S.f.l2||o.l2===S.f.l2);
  const allPlays = trackedOpps();
  const cm = committedMid(), rz = realizedTotal();
  const drift = driftOpps();
  const atRiskMid = drift.reduce((s,o)=>s+resolveSavings(o).mid,0);

  if (allPlays.length===0) return `<div class="screen">${stamp()}
    <div class="panel"><div class="empty"><div class="ei">◔</div><div class="et">Nothing committed yet</div>
    <div class="ed">Commit opportunities from the feed to start tracking realization.</div>
    <button class="btn pri sm" data-act="nav" data-go="feed">Open the opportunity feed</button></div></div></div>`;

  const ramp = rampData();
  const maxV = Math.max(...ramp.map(r=>Math.max(r.proj,r.real)), 1);

  return `<div class="screen">
    ${stamp(SCOPES[S.scope].label+" scope")}
    <div class="kpis">
      ${kpi("Committed value", fmtC(cm), `${allPlays.length} ${allPlays.length===1?"play":"plays"} · Σ midpoints of committed ranges`, "committedKpi")}
      ${kpi("Live", String(allPlays.filter(o=>o.live).length), "in execution")}
      ${kpi("Realized YTD", fmtC(rz), cm>0?`${Math.round(rz/cm*100)}% of committed · measured only`:"measured only", "realized", rz>0?"good":"")}
      ${drift.length
        ? `<div class="kpi"><div class="kl">At risk</div><div class="kv bad">${fmtC(atRiskMid)}</div><div class="kc">${drift.length} ${drift.length===1?"play":"plays"} flagged for drift</div></div>`
        : `<div class="kpi"><div class="kl">At risk</div><div class="kv good">None</div><div class="kc">all plays on plan</div></div>`}
    </div>

    <div class="panel">
      <div class="ph"><span class="t">Savings ramp · quarterly</span>
        <div class="legend"><span><span class="sw" style="background:var(--blue)"></span>Projected</span><span><span class="sw" style="background:var(--green2)"></span>Realized (measured)</span></div>
        <div class="grow"></div>
        <span class="chip stage" title="Fills each live play's next quarter on-pace — not real ERP data. The SAP fact_spend_actual feed replaces this with no Monitor logic change.">Demo · simulate SAP</span>
        <button class="btn sm" data-act="sap-post">Post next quarter</button>
        <button class="btn sm" data-act="sap-reset">Reset actuals</button></div>
      <div class="pb">
        <div class="chart">
          ${ramp.map(r=>`<div class="cgroup">
            <div class="cbar proj" style="height:${Math.max(2,r.proj/maxV*100)}%"><span class="bl">${r.proj>0?fmtK(r.proj):""}</span></div>
            <div class="cbar real" style="height:${Math.max(r.real>0?2:0,r.real/maxV*100)}%">${r.real>0?`<span class="bl" style="color:var(--green)">${fmtK(r.real)}</span>`:""}</div>
          </div>`).join("")}
        </div>
        <div class="cxlbl">${ramp.map(r=>`<span>${r.q.replace(" 20"," '")}</span>`).join("")}</div>
        <p style="font-size:11px;color:var(--ink3);margin-top:8px">Flat quarterly annualization assumed (midpoint ÷ 4 from each play's committed quarter) — per-lever ramp months land with the engine feed. Realized is measured actuals only; a projection is never painted green.</p>
      </div>
    </div>

    <div class="panel">
      <div class="tabs" role="tablist">
        ${[["all","All",allPlays.length],["notstarted","Not started",allPlays.filter(o=>!o.live&&o.status!=="realized").length],["live","Live",allPlays.filter(o=>o.live).length]]
          .map(([id,l,n])=>`<button class="tab ${S.trackTab===id?"on":""}" role="tab" data-act="track-tab" data-tab="${id}">${l} <span class="ct">${n}</span></button>`).join("")}

      ${plays.length===0?`<div class="empty"><div class="ei">◔</div><div class="et">No plays match</div>
        <div class="ed">Adjust the stage tab or the sub-category filter.</div>
        <button class="btn sm" data-act="clear-filters">Clear filters</button></div>`:`
      <div class="pb tight tblwrap"><table class="tbl">
        <thead><tr><th>Play</th><th>Sub-category</th><th>Country</th><th class="num">Committed</th><th>Timing</th><th>Basis</th><th>Status</th><th>Risk</th><th class="num">Realized</th></tr></thead>
        <tbody>${plays.map(o=>{ const r=resolveSavings(o); const rl=(o.actuals||[]).reduce((s,a)=>s+a.amt,0);
          return `<tr class="rowlink" data-act="open-track" data-id="${o.id}">
          <td><b>${esc(o.l3)}</b> <span style="color:var(--ink3);font-size:11.5px">${o.id}</span></td>
          <td>${esc(o.l2)}</td><td>${esc(o.country)}</td>

          <td style="font-size:12px;color:var(--ink2)">${esc(o.committed?.basis||"—")}</td>
          <td>${o.status==="realized"?`<span class="chip ok">Closed</span>`:o.live?`<span class="chip ok">Live</span>`:`<span class="chip stage">Not started</span>`}</td>
          <td>${o.drift&&o.drift.flagged?`<span class="chip drift" title="${esc(o.drift.diff)}">⚑ Drift</span>`:o.live?`<span class="chip ok">On plan</span>`:"—"}</td>
          <td class="num" style="color:${rl>0?"var(--green)":"var(--ink3)"};font-weight:${rl>0?"700":"400"}">${rl>0?fmtC(rl):"$0"}</td>
        </tr>`;}).join("")}</tbody>
      </table></div>`}
    </div>
  </div>`;
}

function renderTrackPanel(o){
  const r = resolveSavings(o);
  const rl = (o.actuals||[]).reduce((s,a)=>s+a.amt,0);
  const pctDone = r.mid>0 ? Math.min(100, rl/r.mid*100) : 0;
  const drifted = o.drift && o.drift.flagged;

  const body = `
    ${drifted?`
    <div class="riskband bad">⚑<div style="flex:1"><b>Drift flagged · ${fmtDay(o.drift.at)}</b>
      ${esc(o.drift.diff)}<div style="font-size:12px;margin-top:4px">${esc(o.drift.detail)}</div>
      <div style="font-size:11.5px;margin-top:6px;color:#7A2222">Engine refreshes never silently mutate an acted play — the decision is sacred; you resolve the drift.</div></div>
      <div class="acts">
        <button class="btn sm pri" data-act="drift-adjust">Apply revised figures</button>
        <button class="btn sm" data-act="drift-reaffirm">Re-affirm commitment</button>
        <button class="btn sm" data-act="drift-escalate">Escalate</button></div></div>`
    : o.live?`<div class="riskband ok">✓<div><b>On plan</b>Realization pacing against the ${esc(o.committed?.timing||"")} ramp.</div></div>`
    : `<div class="riskband warn">◷<div><b>Not started</b>Committed, execution not yet marked live.</div></div>`}

    <div class="eblock"><div class="eh">$ Realized vs target</div>
      <div class="eb" style="display:flex;flex-direction:column;gap:9px">
        <div style="display:flex;justify-content:space-between;font-size:13px">
          <span>Committed target <b style="font-variant-numeric:tabular-nums">${fmtRange(r.lo,r.hi)}</b> <span style="color:var(--ink3);font-size:11px">midpoint ${fmtC(r.mid)}</span></span>
          <span>Realized <b style="color:${rl>0?"var(--green)":"var(--ink)"};font-variant-numeric:tabular-nums">${fmtC(rl)}</b></span></div>
        <div class="progress"><i style="width:${pctDone}%"></i></div>
        ${rl===0?`<div class="notebox"><b>Realized fills from measured actuals only</b>realized = baseline run rate − post-award run rate, price and volume separated. POC actuals are CM-entered or demo-simulated; the SAP fact_spend_actual feed flips in with no Monitor logic change.</div>`:`
        <div style="font-size:12px;color:var(--ink2)">${(o.actuals||[]).map(a=>`${a.q}: <b>${fmtC(a.amt)}</b>`).join(" · ")} <span class="chip stage" style="margin-left:6px">demo actuals</span></div>`}
      </div></div>

    <div class="eblock"><div class="eh">◷ Activity</div>
      <div class="tline">${o.events.map(e=>`
        <div class="te"><span class="dot ${e.actor==="Mercer"?(e.kind==="drift-flagged"?"red":"merc"):e.kind==="committed"?"green":""}"></span>
          <div><div class="tw"><b>${esc(e.actor)}</b> ${eventPhrase(e.kind)}</div><div class="td2">${fmtDay(e.at)}${e.note?` · ${esc(e.note)}`:""}</div></div></div>`).join("")}
      </div></div>`;

  const footer = `
    <button class="btn christy" data-act="mercer-about-track">✦ Ask Mercer about this</button>
    <div class="grow"></div>
    <button class="btn" data-act="open-qualify-ro">Evidence pack</button>
    ${o.status==="realized"?`<span class="chip ok">Closed ✓</span>`
      :`<button class="btn pri" data-act="toggle-live">${o.live?"Mark not started":"Mark live"}</button>`}`;

  return modalShell("track", o.id, o.l3+" · "+o.country+" — value realization", `
    <span class="metachip">${esc(o.committed?.timing||"")} · ${esc(o.committed?.basis||"")}</span>
    ${o.drift&&o.drift.flagged?`<span class="chip drift">⚑ Drift</span>`:o.live?`<span class="chip ok">Live</span>`:`<span class="chip stage">Not started</span>`}`,
    body, footer);
}

<script>
/* ═══ VENDORS — one data-confidence model whose edits really move the score
       (audit N3) · Live vs Illustrative honesty · rows link to their plays ═══ */

function vendorRole(v){
  if (v.oem) return { label:"OEM / sole-source", cls:"oem" };
  const winnerIn = OPPS.some(o=>o.roster.some(rv=>rv.win && rv.n===v.n));
  if (winnerIn) return { label:"Winner / incumbent", cls:"anchor" };
  if (v.s>=prm("tier_keep_min_spend")) return { label:"Keep · strategic", cls:"ok" };
  if (v.s>=prm("tier_leverage_min_spend")) return { label:"Leverage", cls:"ev" };
  if (v.s>=prm("tier_consolidate_min_spend")) return { label:"Consolidate (fold)", cls:"flag" };
  return { label:"Tail / exit", cls:"stage" };
}
function vendorOpps(v){ return OPPS.filter(o=>o.roster.some(rv=>rv.n===v.n)); }

function renderVendors(){
  let vs = vScoped();
  const total = vs.reduce((s,v)=>s+v.s,0);
  const q = S.vf.q.trim().toLowerCase();
  let rows = vs.filter(v =>
    (!q || v.n.toLowerCase().includes(q)) &&
    (!S.vf.l2 || v.l2===S.vf.l2) &&

  const roles = [...new Set(vs.map(v=>vendorRole(v).label))];

  return `<div class="screen">
    ${stamp(SCOPES[S.scope].label+" scope")}
    <div class="notebox"><b>What's live vs illustrative</b>Roster, spend, overlap, sourcing role and data confidence are live from the ledgers. <b>Performance</b> is an illustrative future module — real where operational data exists (delivery, transaction volume), illustrative elsewhere; every dimension is labeled.</div>

    <div class="kpis">
      ${kpi("Vendors under management", String(vs.length), "AT + AOH combined")}
      ${kpi("Spend covered", fmtM(total), "annual · ties to the MRO cube")}
      ${kpi("Overlap vendors", String(vs.filter(v=>v.e==="Both").length), "serve both entities — the merger leverage")}
      ${kpi("In opportunities", `${inOpps}`, `of ${vs.length} suppliers appear in plays`)}
      ${kpi("Terms data coverage", `${Math.round((vs.length-noTerms)/Math.max(1,vs.length)*100)}%`, `${noTerms} vendors have no terms on file — arrives with the SAP feed`, "termsbench")}
    </div>

    <div class="panel">
      <div class="ph"><span class="t">Suppliers</span><span class="s">${rows.length} shown · sorted by spend</span></div>
      <div class="toolbar">
        <div class="search">⌕ <input data-in="vq" value="${esc(S.vf.q)}" placeholder="Search vendors…" aria-label="Search vendors"></div>
        <select class="fsel" data-in="vrole" aria-label="Sourcing role filter"><option value="">All roles</option>${roles.map(x=>`<option ${S.vf.role===x?"selected":""}>${x}</option>`).join("")}</select>
        <select class="fsel" data-in="vl2" aria-label="Sub-category filter"><option value="">All sub-categories</option>${l2s.map(x=>`<option ${S.vf.l2===x?"selected":""}>${x}</option>`).join("")}</select>
        <select class="fsel" data-in="vent" aria-label="Entity filter"><option value="">All entities</option>${["AT","AOH","Both"].map(x=>`<option ${S.vf.entity===x?"selected":""}>${x}</option>`).join("")}</select>
        <button class="ftog ${S.vf.overlap?"on":""}" data-act="v-overlap">Serves both entities <span class="ct">${vs.filter(v=>v.e==="Both").length}</span></button>
      </div>
      ${rows.length===0?`<div class="empty"><div class="ei">⌂</div><div class="et">No vendors match</div><div class="ed">Search and filters returned no vendors from the combined roster.</div><button class="btn sm" data-act="v-clear">Clear filters</button></div>`:`
      <div class="pb tight tblwrap"><table class="tbl">
        <thead><tr><th>Vendor</th><th>Entity</th><th>Sub-category</th><th class="num">Annual spend</th><th>Sourcing role</th>
          <th class="num">Data confidence <button class="info" data-act="explain" data-key="dataconf" aria-label="What data confidence measures">i</button></th>
          <th class="num">Performance <span class="chip illus" style="font-size:9px">partly illustrative</span></th><th class="num">In plays</th></tr></thead>
        <tbody>${rows.map(v=>{ const role=vendorRole(v); const n=vendorOpps(v).length;
          return `<tr class="rowlink" data-act="open-vendor" data-id="${v.id}">
          <td><b>${esc(v.n)}</b>${v.terms==null?` <span class="chip flag" title="No payment-terms data on file — data confidence is capped until the SAP feed lands">terms gap</span>`:""}</td>
          <td>${buChip(v.e)}</td><td>${esc(v.l2)}</td>
          <td class="num">${fmtC(v.s)}</td>
          <td><span class="chip ${role.cls}">${role.label}</span></td>
          <td class="num"><span class="share"><span class="strack"><i style="width:${v.score}%"></i></span><span>${v.score}</span></span></td>
          <td class="num" style="color:var(--ink2)">${v.perf.score}</td>
          <td class="num">${n||"—"}</td></tr>`;}).join("")}</tbody>
      </table></div>`}
    </div>
  </div>`;
}

function renderVendorPanel(v){
  const role = vendorRole(v);
  const plays = vendorOpps(v);
  const e = S.vEdit;
  const leadVal = e.lead!=="" ? Number(e.lead) : v.lead;
  const termsVal = e.terms!=="" ? Number(e.terms) : v.terms;

  const body = `
    <div class="mstiles">
