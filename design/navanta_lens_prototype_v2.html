      <div class="mstile" style="background:#fff;border-color:var(--line)"><span class="l">Entity</span><span class="v">${v.e}</span><span class="c">${v.e==="Both"?"cross-division leverage":"single division"}</span></div>
      <div class="mstile" style="background:#fff;border-color:var(--line)"><span class="l">Sourcing role</span><span class="v" style="font-size:12.5px">${role.label}</span><span class="c">tiers per A.4 dials</span></div>
      <div class="mstile" style="background:#fff;border-color:var(--line)"><span class="l">Type</span><span class="v" style="font-size:12.5px;text-transform:capitalize">${esc(v.t.replace("-"," "))}</span><span class="c">${v.oem?"OEM — never the winner":"contestable"}</span></div>
    </div>

    <div class="eblock"><div class="eh">◈ Data confidence · ${v.score} <div class="grow"></div>
      <button class="info" data-act="explain" data-key="dataconf" aria-label="What data confidence measures">i</button></div>
      <div class="eb" style="padding:0"><div class="scorebars">
        ${v.dc.map(c=>`<div class="sb"><span class="l">${c.label}</span>
          <span class="ob">${esc(c.note)} <span class="track" style="display:inline-block;width:56px;vertical-align:middle;margin-left:6px"><i style="width:${c.score}%"></i></span></span>
          <span class="v">${c.score} <span style="color:var(--ink3);font-weight:400">× ${c.weight}</span></span></div>`).join("")}
        <div class="sb res"><span class="l"><b>Composite</b></span><span class="ob">Σ weight × criterion</span><span class="v"><b>${v.score}</b></span></div>
      </div></div>
      <div class="efoot">Measures how complete and well-evidenced <b>our data</b> on this vendor is — never vendor merit. OEM status is a note, not points.</div>
    </div>

    <div class="eblock"><div class="eh">✎ Update operational data</div>
      <div class="eb"><div class="frow2">
        <div class="field"><label>Lead time (days)</label><input type="number" min="0" data-in="ve-lead" value="${esc(e.lead!==""?e.lead:(v.lead??""))}" placeholder="${v.lead??"none on file"}"><span class="help">Slips reduce the operational criterion; on-file data raises it.</span></div>
        <div class="field"><label>Payment terms (net days)</label><input type="number" min="0" data-in="ve-terms" value="${esc(e.terms!==""?e.terms:(v.terms??""))}" placeholder="${v.terms??"none on file"}"><span class="help">Scores vs the Net ${prm("benchmark_terms_target")} benchmark; blank caps the criterion with “No terms data on file”.</span></div>
      </div>
      ${changed?`<div style="background:var(--merc-bg);border-radius:8px;padding:7px 11px;font-size:12px;color:var(--merc);margin-top:9px">↻ Data confidence re-derives to <b>${previewScore}</b> (${previewScore>v.score?"+":""}${previewScore-v.score}) on save — same criteria keys, so the edit really moves the composite.</div>`:""}
      </div>
      <div class="eact"><span style="flex:1;font-size:12px;color:var(--ink3)">Edits log to the vendor's audit trail.</span>
        <button class="btn pri sm" data-act="ve-save" ${changed?"":"disabled"}>Save</button></div></div>

    <div class="eblock"><div class="eh">◔ Performance · ${v.perf.score} <span class="chip illus">future module</span></div>
      <div class="eb" style="padding:0"><div class="scorebars">
        ${v.perf.dims.map(d=>`<div class="sb"><span class="l">${d.label} ${d.live?`<span class="chip live" style="font-size:9px">Live</span>`:`<span class="chip illus" style="font-size:9px">Illustrative</span>`}</span>
          <span class="ob">${esc(d.basis)}</span><span class="v">${d.score} <span style="color:var(--ink3);font-weight:400">× ${d.weight}</span></span></div>`).join("")}
      </div></div>
      <div class="efoot">Real where operational data exists; illustrative elsewhere — labeled per dimension, never blended silently.</div>
    </div>

    <div class="eblock"><div class="eh">◫ Appears in ${plays.length} ${plays.length===1?"play":"plays"}</div>
      <div class="eb" style="padding:0">${plays.length?plays.map(o=>{ const rv=o.roster.find(x=>x.n===v.n); return `
        <button class="task" style="padding:9px 14px" data-act="open-opp-from-vendor" data-id="${o.id}">
          <span style="flex:1;text-align:left"><b>${o.id}</b> ${esc(o.l3)} · ${esc(o.country)} ${rv.win?`<span class="chip anchor">★ Anchor</span>`:rv.oem?`<span class="chip oem">OEM</span>`:""}</span>
          <span style="font-variant-numeric:tabular-nums;color:var(--ink2)">${fmtC(rv.s)} · ${(rv.s/o.pocket*100).toFixed(1)}%</span>

  return modalShell("vendor", v.n, `${v.l2} · ${v.e==="Both"?"AT + AOH":v.e}`, `${buChip(v.e)}<span class="chip ${role.cls}">${role.label}</span>`, body, footer);
}
</script>
<script>
/* ═══ METHODOLOGY & PARAMETERS — the explainer derives its numbers from the
       LIVE dials (audit N6): edit a rate and the prose above updates. ═══ */

function rateWords(key){ const v = draftVal(key); return Array.isArray(v) ? `${Math.round(v[0]*100)}–${Math.round(v[1]*100)}%` : String(v); }
function draftVal(key){ return key in S.mDraft ? S.mDraft[key] : prm(key); }
/* Raw (as-typed) values + validity — the field NEVER snaps back mid-edit;
   invalid input shows a red border and an inline error, and blocks Save. */
S.mRaw = S.mRaw || {};
function mRangeRaw(p){ const r = S.mRaw[p.key]; return r || { lo:String(p.value[0]), hi:String(p.value[1]) }; }
function mScalarRaw(p){ return p.key in S.mRaw ? S.mRaw[p.key] : String(p.value); }
function mValidity(p){
  if (p.unit==="structural") return { valid:true };
  if (p.unit==="rate_range"){
    const r = mRangeRaw(p); const lo=Number(r.lo), hi=Number(r.hi);
    if (r.lo===""||r.hi===""||!Number.isFinite(lo)||!Number.isFinite(hi)||lo<0||hi>1||lo>1||hi<0) return { valid:false, msg:"Both rates must be between 0 and 1" };
    if (lo>hi) return { valid:false, msg:"Low must be ≤ high" };
    return { valid:true };
  }
  const raw = mScalarRaw(p); const n=Number(raw);
  if (raw===""||!Number.isFinite(n)||n<0) return { valid:false, msg:"Enter a non-negative number" };
  return { valid:true };
}
function mInvalidCount(){ return PARAMS.filter(p=>p.key in S.mRaw && !mValidity(p).valid).length; }

function methodologySteps(){
  return [
    { n:1, t:"Rank the categories (scan)", f:`score = Prize × Feasibility × Provability^${draftVal("prov_exponent")}`,
      d:"Every sub-category is scored on size (Prize), how actionable it is (Feasibility: fragmentation + cross-BU overlap), and how defensible the savings are (Provability). Provability is raised to the exponent because the engagement is outcome-based — well-evidenced categories rank far above speculative ones.",
      keys:["prov_exponent","feas_frag_weight","feas_xbu_weight"] },
    { n:2, t:"Cut the spend into pockets", f:"pocket = L3 commodity × purchasing country",
      d:`Pockets below $${nf(draftVal("pocket_min_spend"))} or ${draftVal("pocket_min_vendors")} vendors are gated out — too small to source, or nothing to consolidate.`,
      keys:["pocket_min_spend","pocket_min_vendors"] },
    { n:3, t:"Carve out what can't be competed", f:"addressable = pocket − OEM / sole-source (− incumbent share if consolidating)",
      d:"OEM and spec-locked lines are held out — OEM is never the winner. Addressable is always labeled an upper bound until the part master confirms contestability.",
      keys:["oem_definition"] },
    { n:4, t:"Route the lever", f:`winner_share ≥ ${Math.round(draftVal("winner_share_consolidate")*100)}% → Consolidate · else → Competitive RFP`,
      d:"If the top non-OEM vendor already anchors the pocket, fold the tail to them; otherwise compete the base. Capability is a flag, not the router.",
      keys:["winner_share_consolidate"] },
    { n:5, t:"Score the confidence", f:`confidence = fit × MIN(gap, ${draftVal("confidence_gap_cap")}) / ${draftVal("confidence_gap_cap")}`,
      d:"Functional fit × a capped fragmentation multiplier. Analyst adjustments are always shown next to the sweep formula — the two never silently contradict. Displayed confidence is banded (High / Medium / Directional) and capped at 99%.",
      keys:["confidence_gap_cap"] },
    { n:6, t:"Apply the savings tiers", f:`savings = addressable × rate (consolidate ${rateWords("savings_rate.consolidate_incumbent")} · RFP ${rateWords("savings_rate.competitive_rfp")} · tail ${rateWords("savings_rate.fragmented_tail")} · services ${rateWords("savings_rate.services")})`,
      d:"Conservative–stretch bands per lever, from the signed methodology (Appendix A.6). This prose reads the live dials below — edit a rate and this sentence changes with it.",
      keys:["savings_rate.consolidate_incumbent","savings_rate.competitive_rfp","savings_rate.fragmented_tail","savings_rate.services"] },
  ];
}

function renderMethodology(){
  const params = PARAMS.filter(p=>p.sec===S.mSec);
  const editedCount = PARAMS.filter(p=>JSON.stringify(p.value)!==JSON.stringify(p.def)).length;
  const draftCount = Object.keys(S.mDraft).length;

  return `<div class="screen">
    ${stamp()}
    <div class="kpis">
      ${kpi("Parameters", String(PARAMS.length), "engine decision dials")}
      ${kpi("Methodology sections", String(SECTIONS.length), "decision-logic groups")}
      ${kpi("Version", S.mVersion, draftCount?`${draftCount} unsaved edit${draftCount===1?"":"s"}`:"active parameter set")}
      ${kpi("Changed from default", String(editedCount), editedCount?"applied on next engine run":"all at seed")}
    </div>

    <div class="panel">
      <div class="ph"><span class="t">How the engine calculates</span><span class="s">scan → opportunity pipeline · each step driven by the dials below — the prose reads the live values</span></div>
      <div class="pb" style="display:flex;flex-direction:column;gap:10px">
        ${methodologySteps().map(st=>`
          <div style="display:flex;gap:12px;align-items:flex-start">
            <span style="width:24px;height:24px;border-radius:50%;background:var(--merc-bg);color:var(--merc);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0">${st.n}</span>
            <div style="flex:1;min-width:0">
              <div style="font-weight:700;font-size:13.5px">${st.t}</div>
              <div style="font-family:var(--mono);font-size:11.5px;background:var(--muted);border-radius:7px;padding:5px 9px;margin:4px 0;overflow-x:auto;white-space:nowrap">${st.f}</div>
              <div style="font-size:12.5px;color:var(--ink2)">${st.d}</div>
              <div style="margin-top:4px;font-size:11px;color:var(--ink3)">Tuned by ${st.keys.map(k=>`<button class="linkbtn" style="font-size:11px" data-act="goto-param" data-param="${k}">${k}</button>`).join(" · ")}</div>
            </div></div>`).join("")}
      </div>
    </div>

    <div class="panel">
      <div class="ph"><span class="t">Parameter registry</span><span class="s">numeric dials are editable — saved to the parameter store, applied on the engine's next run. Structural parameters are read-only.</span></div>
      <div class="tabs" role="tablist">
        ${SECTIONS.map(s=>`<button class="tab ${S.mSec===s.id?"on":""}" role="tab" data-act="msec" data-sec="${s.id}">${s.label} <span class="ct">${PARAMS.filter(p=>p.sec===s.id).length}</span></button>`).join("")}
      </div>
      <div class="pb tight tblwrap"><table class="tbl">
        <thead><tr><th style="width:30%">Parameter</th><th>Value</th><th style="width:44%">What it does</th></tr></thead>
        <tbody>
          ${params.map(p=>paramRow(p)).join("")}
        </tbody></table></div>
      ${(draftCount||mInvalidCount())?`
      <div class="pb" style="display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);background:var(--raised)">
        <span style="font-size:12.5px;color:${mInvalidCount()?"var(--red)":"var(--ink2)"}">${mInvalidCount()
          ?`<b>Fix ${mInvalidCount()} invalid value${mInvalidCount()===1?"":"s"} to save.</b>`
          :`<b>${draftCount} unsaved change${draftCount===1?"":"s"}</b> — applied on the engine's next run; figures on screen don't change until the re-run.`}</span>
        <div style="flex:1"></div>
        <button class="btn sm" data-act="mdiscard">Discard</button>
        <button class="btn pri sm" data-act="msave" ${mInvalidCount()||!draftCount?"disabled":""}>Save ${draftCount} change${draftCount===1?"":"s"}</button>
      </div>`:""}
      ${S.mSavedNote?`<div class="pb" style="border-top:1px solid var(--line)"><div class="riskband ok" style="margin:0">✓<div><b>${esc(S.mSavedNote)}</b>The engine applies these on its next run — version bumped to ${S.mVersion}. Every figure keeps its lineage stamp.</div></div></div>`:""}
    </div>
  </div>`;
}

function paramRow(p){
  const structural = p.unit==="structural";
  const edited = JSON.stringify(p.value)!==JSON.stringify(p.def);
  const hasDraft = p.key in S.mDraft;
  const validity = mValidity(p);
  const inputStyle = (bad)=>`width:${p.unit==="rate_range"?"70":"110"}px;border:1px solid ${bad?"var(--red)":"var(--line2)"};border-radius:7px;padding:4px 7px;font-size:12px`;
  let valueCell;
  if (structural){
    valueCell = `<span class="chip stage" style="white-space:normal;text-align:left">${esc(String(p.value))}</span><span class="sub">Read-only (structural)</span>`;
  } else if (p.unit==="rate_range"){
    const r = mRangeRaw(p);
    valueCell = `<span style="display:inline-flex;gap:5px;align-items:center">
      <input type="number" step="0.005" min="0" max="1" data-in="mparam-lo" data-key="${p.key}" value="${esc(r.lo)}" style="${inputStyle(!validity.valid)}">
      –
      <input type="number" step="0.005" min="0" max="1" data-in="mparam-hi" data-key="${p.key}" value="${esc(r.hi)}" style="${inputStyle(!validity.valid)}">
      <span style="font-size:11px;color:var(--ink3)">rate</span></span>
      ${!validity.valid?`<span class="sub" style="color:var(--red);font-weight:600">${validity.msg}</span>`
        :hasDraft?`<span class="sub" style="color:var(--merc);font-weight:600">Unsaved</span>`
        :edited?`<span class="sub">Changed from default (${p.def[0]}–${p.def[1]})</span>`:""}`;
  } else {
    valueCell = `<span style="display:inline-flex;gap:5px;align-items:center">
      <input type="number" step="any" min="0" data-in="mparam" data-key="${p.key}" value="${esc(mScalarRaw(p))}" style="${inputStyle(!validity.valid)}">
      <span style="font-size:11px;color:var(--ink3)">${p.unit}</span></span>
      ${!validity.valid?`<span class="sub" style="color:var(--red);font-weight:600">${validity.msg}</span>`
        :hasDraft?`<span class="sub" style="color:var(--merc);font-weight:600">Unsaved</span>`
        :edited?`<span class="sub">Changed from default (${p.def})</span>`:""}`;
  }
  return `<tr id="param-${cssId(p.key)}">
    <td><b>${esc(p.label)}</b><span class="sub" style="font-family:var(--mono);font-size:10.5px">${esc(p.key)}</span></td>
    <td>${valueCell}</td>
    <td style="font-size:12px;color:var(--ink2)">${esc(p.desc)}</td></tr>`;
}
function cssId(key){ return key.replace(/[^a-zA-Z0-9_-]/g,"_"); }

function gotoParam(key){
  const p = PARAMS.find(x=>x.key===key);
  if(!p) return;
  S.screen = "methodology"; S.mSec = p.sec;
  closeAllModals(); closeExplain(); render();
  requestAnimationFrame(()=>{
    const row = document.getElementById("param-"+cssId(key));
    if(row){ row.scrollIntoView({ block:"center" }); row.classList.add("flash-param"); setTimeout(()=>row.classList.remove("flash-param"),1700); }
  });
}
function closeAllModals(){
  S.panelOpen=false; S.actOpen=false; S.parkOpen=false; S.rejectOpen=false;
  S.trackPanel=false; S.vPanel=false; S.pillar=null; S.bulkKind=null;
}
</script>
<script>
/* ═══ ASK MERCER — deictic copilot: scoped to the view, cites the records it
       used, never invents a figure. + Demo menu + event wiring + boot. ═══ */

S.mercerInput = "";

function mercerSuggestions(){
  const ctx = S.mercerCtx;
  if (ctx.page==="qualify" && ctx.oppId){
    const o = oppById(ctx.oppId); if(!o) return [];
    const s = [
      { q:`Why ${o.lever==="consolidate"?"consolidate":"an RFP"} and not ${o.lever==="consolidate"?"an RFP":"consolidate"}?`, a:()=>{
        const top = o.roster.filter(v=>!v.oem).sort((a,b)=>b.s-a.s)[0];
        const share = Math.round(top.s/o.pocket*1000)/10;
        return { t:`The lever routes on winner share. ${top.n} holds ${share}% of this pocket — ${o.lever==="consolidate"?`at or above the ${prm("winner_share_consolidate")*100}% threshold, so the play folds the tail to the incumbent (movable = pocket − winner − OEM)`:`below the ${prm("winner_share_consolidate")*100}% threshold, so there's no anchor to fold into and the base is competed (movable = pocket − OEM)`}. Capability is a flag, not the router.`,
          c:[`${o.id}.roster → ${top.n} $${nf(top.s)} / pocket $${nf(o.pocket)}`,`parameter winner_share_consolidate = ${prm("winner_share_consolidate")}`] }; } },
      { q:"What's excluded from addressable?", a:()=>{
        return { t:`${fmtC(o.pocket)} pocket − ${o.exclusions.map(e=>`${fmtC(e.amount)} (${e.label.toLowerCase()})`).join(" − ")} = ${fmtC(o.movable)} addressable. It's an upper bound — material_id isn't a cross-vendor part number yet, so contestability is confirmed against the part master before you commit.`,
          c:o.exclusions.map(e=>`${o.id}.exclusions → ${e.label}: $${nf(e.amount)} — ${e.reason}`) }; } },
      { q:`Why confidence ${Math.min(CONF_CEILING,o.conf)}%?`, a:()=>{
        const cap = prm("confidence_gap_cap"); const gm = Math.min(o.gap,cap)/cap; const f = Math.round(o.fit*gm*100);
        return { t:`Fit ${o.fit.toFixed(2)} × fragmentation multiplier ${gm.toFixed(2)} (MIN(${o.gap}, ${cap})/${cap}) = ${f}%${o.analystAdjusted?`, analyst-adjusted to ${o.conf}%: ${o.adjustNote}`:" — formula-scored, no adjustment"}. Band: ${band(o.conf).word}. Confidence is independent of dollar size — that's why the feed ranks on Impact instead.`,
          c:[`${o.id}.fit = ${o.fit}`,`${o.id}.gap = ${o.gap} · parameter confidence_gap_cap = ${cap}`] }; } },
    ];
    if (o.lever==="rfp") s.push({ q:"Who should bid?", a:()=>{
      const el = o.roster.filter(v=>!v.oem&&v.s/o.pocket>=0.05).sort((a,b)=>b.s-a.s).slice(0,5);
      return { t:`${el.map(v=>`${v.n} (${Math.round(v.s/o.pocket*100)}%${v.cap==="broad-line"?", broad-line":""})`).join(" · ")}. Broad-line suppliers can anchor the full consolidated scope; the rest bring competitive tension. OEM / sole-source are excluded — they can't be competed.`,
        c:[`${o.id}.roster — ${el.length} vendors ≥5% share, OEM excluded`] }; } });
    return s;
  }
  if (ctx.page==="track" && ctx.oppId){
    const o = oppById(ctx.oppId); if(!o) return [];
    const s = [];
    if (o.drift && o.drift.flagged) s.push({ q:`What drifted on ${o.id}?`, a:()=>({
      t:`${o.drift.diff}. ${o.drift.detail} Your commitment wasn't touched — engine refreshes never silently mutate an acted play. Resolve it: apply revised figures, re-affirm, or escalate.`,
      c:[`${o.id}.drift — flagged ${o.drift.at}`,`engine invariant: decisions are sacred`] }) });
    s.push({ q:"Why is realized so small vs committed?", a:()=>({
      t:`Realized is measured actuals only — baseline run rate minus post-award run rate as invoices post. ${fmtC(realizedTotal())} has been measured so far against ${fmtC(committedMid())} committed (midpoints). Projections are painted blue, never green.`,
      c:["Monitor: realized = baseline − post-award run rate","POC actuals: CM-entered / demo-simulated"] }) });
    return s;
  }
  if (ctx.page==="vendor" && ctx.vendorId){
    const v = VENDORS.find(x=>x.id===ctx.vendorId); if(!v) return [];
    return [
      { q:`Why is ${v.n.split(" ")[0]}'s data confidence ${v.score}?`, a:()=>({
        t:`${v.dc.map(c=>`${c.label} ${c.score} (${c.note})`).join(" · ")}. Composite = Σ weight × criterion = ${v.score}. It measures how complete our data is — not vendor merit.`,
        c:v.dc.map(c=>`${v.id}.dc.${c.key} = ${c.score} × ${c.weight}`) }) },
      { q:"Which plays touch this vendor?", a:()=>{
        const ps = vendorOpps(v);
        return { t: ps.length?`${ps.map(o=>`${o.id} (${o.l3} · ${o.country}${o.roster.find(x=>x.n===v.n).win?", anchor":""})`).join(" · ")}. Open any of them from the panel's play list.`:"None — this vendor's spend sits below the pocket materiality gates.",
          c: ps.map(o=>`${o.id}.roster → ${v.n}`) }; } },
    ];
  }
  if (ctx.page==="feed"){
    return [
      { q:"Why is the top item ranked first?", a:()=>{
        const rows = feedRows(); const t = rows[0];
        if(!t) return { t:"The feed is clear — nothing to rank.", c:[] };
        return { t:`Ranking is declared above the table: ${SORTS[S.sort].label}. ${t.id} leads${S.sort==="impact"?` with ${fmtC(t.movable)} addressable × ${t.conf}% confidence = ${fmtC(impact(t))} impact`:""}. Flip the control to re-rank — the rule is never implicit.`,
          c:[`sort = ${S.sort}`, `${t.id}: movable $${nf(t.movable)} · confidence ${t.conf}%`] }; } },
      { q:"What changed since my last sweep?", a:()=>{
        const fresh = feedOpps().filter(o=>isNewSince(o)||isChangedSince(o));
        return { t: fresh.length?fresh.map(o=>`${o.id}: ${isNewSince(o)?(o.newSignal||"new this sweep"):o.changed.note}`).join(" · "):"Nothing new since your last sweep.",
          c: fresh.map(o=>`${o.id}.events — latest ${o.events.at(-1).at}`) }; } },
      { q:"What's the scan's coverage?", a:()=>({
        t:`${SCAN.length} of ${MRO_L2_TOTAL} MRO sub-categories scanned; ${new Set(scoped().map(o=>o.l2)).size} yielded pockets above the $${nf(prm("pocket_min_spend"))} / ${prm("pocket_min_vendors")}-vendor gates. Welding Supplies scanned clean — no pocket cleared materiality.`,
        c:["scan scorecard — 5 rows","parameters pocket_min_spend · pocket_min_vendors"] }) },
    ];
  }
  if (ctx.page==="methodology"){
    return [
      { q:"What does the provability exponent do?", a:()=>({
        t:`The scan score is Prize × Feasibility × Provability^${prm("prov_exponent")}. Squaring provability makes defensible evidence dominate the ranking — under outcome-based fees, a speculative big number is worth less than a provable smaller one.`,
        c:["parameter prov_exponent = "+prm("prov_exponent")] }) },
      { q:"What happens when I edit a dial?", a:()=>({
        t:"Edits save to the parameter store and apply on the engine's next run — figures on screen keep their lineage stamp until the re-run. The explainer prose above the registry reads the live dials, so it updates with your draft.",
        c:["parameter registry — versioned, change-controlled"] }) },
    ];
  }
  /* dashboard / tracking / vendors default */
  return [
    { q:"What needs me today?", a:()=>({
      t:`${feedOpps().length} opportunities await triage (${feedOpps().filter(o=>o.conf>=60).length} high-confidence). ${driftOpps().length?driftOpps().map(o=>o.id).join(", ")+" flagged for drift — resolve in Value Realization.":"No drift — all plays on plan."}`,
      c:["opportunity store — live counts"] }) },
    { q:"Where does identified value come from?", a:()=>({
      t:`${fmtC(identifiedMid())} = Σ midpoints of every non-rejected opportunity's savings range. Committed (${fmtC(committedMid())}) and realized (${fmtC(realizedTotal())}) are separate, narrower quantities — the funnel shows the conversion.`,
      c: scoped().filter(o=>o.status!=="rejected").map(o=>`${o.id}: mid $${nf(resolveSavings(o).mid)}`) }) },
  ];
}

function mercerAnswer(text){
  const suggs = mercerSuggestions();
  const q = text.toLowerCase();
  const hit = suggs.find(s=>s.q.toLowerCase().split(" ").filter(w=>w.length>4).some(w=>q.includes(w.replace(/[?'.]/g,""))));
  if (hit) return hit.a();
  return { t:"In the POC I answer scoped questions about what's on screen, grounded in the records you see — I don't invent figures. Try one of the suggestions below, or ask about a number you're looking at.", c:[] };
}
function ctxLabel(){
  const c = S.mercerCtx;
  if (c.page==="qualify" && c.oppId) return "Qualify · "+c.oppId;
  if (c.page==="track" && c.oppId) return "Value Realization · "+c.oppId;
  if (c.page==="vendor" && c.vendorId){ const v=VENDORS.find(x=>x.id===c.vendorId); return "Vendor · "+(v?v.n.slice(0,18):""); }
  return SCREEN_TITLES[c.page] || "Command Center";
}
function renderMercer(){
  const dock = document.getElementById("mercdock");
  document.getElementById("main").classList.toggle("mercer-open", S.mercerOpen);
  dock.classList.toggle("on", S.mercerOpen);
  if (!S.mercerOpen){ dock.innerHTML=""; return; }
  dock.innerHTML = `
    <div class="mdh"><svg class="star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8L12 2z"/></svg>
      Ask Mercer <span class="ctx" title="Mercer sees what you see — answers are scoped to this view">${esc(ctxLabel())}</span>
      <div style="flex:1"></div><button class="mclose" data-act="mercer-close" aria-label="Close">✕</button></div>
    <div class="msgs" id="mercer-msgs">
      ${S.mercerMsgs.length===0?`<div class="msg mercer">Scoped to <b>${esc(ctxLabel())}</b>. I answer from the records on screen and cite what I used — never an invented figure. Drafts are templates; nothing auto-sends.</div>`:""}
      ${S.mercerMsgs.map(m=>`<div class="msg ${m.role}">${esc(m.t)}${m.c&&m.c.length?`<div class="cites"><b>Grounded in:</b> ${m.c.map(esc).join(" · ")}</div>`:""}</div>`).join("")}
    </div>
    <div class="sugg">${mercerSuggestions().map(s=>`<button data-act="mercer-sugg" data-q="${esc(s.q)}">${esc(s.q)}</button>`).join("")}</div>
    <div class="mercin"><input data-in="mercer-q" placeholder="Ask about this view…" value="${esc(S.mercerInput)}" aria-label="Ask Mercer">
      <button class="btn christy sm" data-act="mercer-send">Ask</button></div>`;
  const box = document.getElementById("mercer-msgs"); if(box) box.scrollTop = box.scrollHeight;
}
function mercerAsk(q){
  S.mercerMsgs.push({ role:"user", t:q });
  const a = (mercerSuggestions().find(s=>s.q===q) || { a:()=>mercerAnswer(q) }).a();
  S.mercerMsgs.push({ role:"mercer", t:a.t, c:a.c });
  S.mercerInput = "";
  render();
}
function setMercerCtx(ctx){ S.mercerCtx = ctx; S.mercerMsgs = []; S.mercerOpen = true; }

/* ── Demo menu (states you'd otherwise need a broken backend to see) ── */
function renderDemo(){
  const d = document.getElementById("demochip");
  d.innerHTML = `
    ${S.demoOpen?`<div class="demomenu" role="menu">
      <button data-act="demo-error">${S.dataError?"✓ Clear simulated data error":"Simulate data-service error"}</button>
      <button data-act="sap-post">Post next quarter (simulate SAP)</button>
      <button data-act="sap-reset">Reset demo actuals</button>
      <button data-act="demo-reset">Reset the whole demo</button>
      <div class="dnote">Prototype-only controls for demoing designed states: the error-vs-loading distinction, SAP actuals, inbox zero.</div>
    </div>`:""}
    <button class="dbtn" data-act="demo-toggle">Demo ${S.demoOpen?"▾":"▴"}</button>`;
}

/* ═══ EVENT WIRING ═══ */
const initialActuals = {};
function boot(){
  OPPS.forEach(o=>{ initialActuals[o.id] = (o.actuals||[]).map(a=>({...a})); });
  document.addEventListener("click", onClick);
  document.addEventListener("change", onChange);
  document.addEventListener("input", onInput);
  document.addEventListener("keydown", onKey);
  render();
}
function onKey(e){
  if (e.key==="Escape"){
    if (document.querySelector(".expop")) return closeExplain();
    if (S.demoOpen){ S.demoOpen=false; return render(); }
    if (S.parkOpen||S.rejectOpen){ S.parkOpen=false; S.rejectOpen=false; S.bulkKind=null; return render(); }
    if (S.actOpen){ S.actOpen=false; return render(); }
    if (S.panelOpen||S.trackPanel||S.vPanel||S.pillar){ S.panelOpen=false;S.trackPanel=false;S.vPanel=false;S.pillar=null; return render(); }
    if (S.mercerOpen){ S.mercerOpen=false; return render(); }
  }
  if (e.key==="Enter" && e.target && e.target.dataset && e.target.dataset.in==="mercer-q" && S.mercerInput.trim()){
    mercerAsk(S.mercerInput.trim());
  }
}
function closeTop(){
  if (S.parkOpen||S.rejectOpen){ S.parkOpen=false; S.rejectOpen=false; S.bulkKind=null; }
  else if (S.actOpen) S.actOpen=false;
  else if (S.pillar) S.pillar=null;
  else if (S.vPanel) S.vPanel=false;
  else if (S.trackPanel) S.trackPanel=false;
  else if (S.panelOpen){ S.panelOpen=false; S.overrideOpen=false; S.inputOpen=false; }
  render();
}

function onClick(e){
  const t = e.target.closest("[data-act]");
  if (!t){
    if (e.target.classList && e.target.classList.contains("overlay")) closeTop();
    else if (!e.target.closest(".expop")) closeExplain();
    return;
  }
  const act = t.dataset.act;
  if (!["explain","close-explain","goto-param","explain-methodology","explain-ask"].includes(act)) closeExplain();
  const o = S.activeId ? oppById(S.activeId) : null;
  switch(act){
    /* nav & chrome */
    case "nav": S.screen = t.dataset.go; S.sel.clear(); closeAllModals(); closeExplain(); S.mercerCtx={page:S.screen}; render(); break;
    case "toast-go": S.screen = t.dataset.go; closeAllModals(); render(); break;
    case "pillar": S.pillar = t.dataset.pillar; render(); break;
    case "cycle-scope": {
      const order = ["ENT","AT","AOH"]; S.scope = order[(order.indexOf(S.scope)+1)%3];
      S.sel.clear(); toast(`Scope → ${SCOPES[S.scope].label} — everything re-derived server-side`, "info"); render(); break; }
    /* explain */
    case "explain": e.stopPropagation(); openExplain(t.dataset.key, t.dataset.opp||null, t); break;
    case "close-explain": closeExplain(); break;
    case "goto-param": gotoParam(t.dataset.param); break;
    case "explain-methodology": closeExplain(); S.screen="methodology"; closeAllModals(); render(); break;
    case "explain-ask": closeExplain(); setMercerCtx(S.panelOpen&&o?{page:"qualify",oppId:o.id}:{page:S.screen}); render(); break;
    /* mercer */
    case "open-mercer": setMercerCtx(S.panelOpen&&o?{page:"qualify",oppId:o.id}:S.trackPanel?{page:"track",oppId:S.trackActive}:S.vPanel?{page:"vendor",vendorId:S.vActive}:{page:S.screen}); render(); break;
    case "mercer-close": S.mercerOpen=false; render(); break;
    case "mercer-sugg": mercerAsk(t.dataset.q); break;
    case "mercer-send": if(S.mercerInput.trim()) mercerAsk(S.mercerInput.trim()); break;
    case "mercer-about-opp": setMercerCtx({page:"qualify",oppId:S.activeId}); render(); break;
    case "mercer-about-track": setMercerCtx({page:"track",oppId:S.trackActive}); render(); break;
    case "mercer-about-vendor": setMercerCtx({page:"vendor",vendorId:S.vActive}); render(); break;
    /* feed */
    case "toggle-scan": S.scanOpen=!S.scanOpen; render(); break;
    case "feed-tab": S.tab=t.dataset.tab; S.sel.clear(); render(); break;
    case "sort-col": { const k=t.dataset.key; if(S.sort===k) S.sortDir=S.sortDir==="desc"?"asc":"desc"; else {S.sort=k;S.sortDir="desc";} render(); break; }
    case "toggle-hiconf": S.f.hiconf=!S.f.hiconf; S.sel.clear(); render(); break;
    case "clear-filters": S.f={l2:null,lever:null,country:null,hiconf:false,q:""}; S.sel.clear(); render(); break;
    /* Selection only ever covers VISIBLE, non-resolving rows — a filter change
       clears it, so bulk actions can never touch a row the user can't see. */
    case "sel-all": { const rows=feedRows().filter(x=>!S.resolving.has(x.id)); const all=rows.length>0&&rows.every(x=>S.sel.has(x.id));
      S.sel.clear(); if(!all) rows.forEach(x=>S.sel.add(x.id)); render(); break; }
    case "sel-row": { const id=t.dataset.id; if(S.resolving.has(id)) break;
      S.sel.has(id)?S.sel.delete(id):S.sel.add(id); render(); break; }
    case "bulk-park": S.bulkKind="park"; S.dlg={parkType:"condition",parkDate:"",parkCond:"",parkOther:"",rejReason:"",rejNote:""}; S.parkOpen=true; render(); break;
    case "bulk-reject": S.bulkKind="reject"; S.dlg={parkType:"condition",parkDate:"",parkCond:"",parkOther:"",rejReason:"",rejNote:""}; S.rejectOpen=true; render(); break;
    case "bulk-clear": S.sel.clear(); render(); break;
    case "open-opp": case "open-opp-from-vendor": {
      const id=t.dataset.id; if(S.resolving.has(id)) break;
      const opp=oppById(id); if(!opp) break;
      S.activeId=id; S.vPanel=false; S.trackPanel=false;
      S.overrideOpen=false; S.inputOpen=false; S.rosterExpanded=false; S.fitDetail=false;
      S.inputDraft=null; S.inputDraftId=null;
      if (opp.status==="accepted"){ S.actOpen=true; S.actDraft={timing:"",basis:"",draftKind:null,draftText:""}; }
      else { S.panelOpen=true; if(opp.status==="surfaced") opp.status="qualifying"; }
      render(); break; }
    /* qualify */
    case "toc": { const el=document.getElementById(t.dataset.target); if(el) el.scrollIntoView({block:"start"}); break; }
    case "toggle-roster": S.rosterExpanded=!S.rosterExpanded; render(); break;
    case "toggle-fit": S.fitDetail=!S.fitDetail; render(); break;
    case "toggle-input": S.inputOpen=!S.inputOpen; S.overrideOpen=false; render(); break;
    case "open-override": S.overrideOpen=true; S.inputOpen=false;
      S.ovDraft={ a:o&&o.ovA!=null?String(o.ovA):"", p:o&&o.ovP!=null?String(o.ovP):"" }; render(); break;
    case "cancel-override": S.overrideOpen=false; render(); break;
    case "apply-override": if(o){
      const a=S.ovDraft.a===""?null:Number(S.ovDraft.a.replace(/[^\d]/g,"")); const p=S.ovDraft.p===""?null:Number(S.ovDraft.p);
      o.ovA=a; o.ovP=p; S.overrideOpen=false;
      o.events.push({at:todayISO(),actor:"Maria Vance",kind:"note",note:(a!=null||p!=null)?"Figures overridden · savings re-derived (workbook baseline preserved)":"Override cleared · back to workbook"});
      toast(a!=null||p!=null?"Figures overridden · savings re-derived":"Override cleared · back to workbook","success"); render(); } break;
    case "save-input": if(o&&S.inputDraft){
      o.userInput={...S.inputDraft, savedAt:todayISO()};
      o.events.push({at:todayISO(),actor:"Maria Vance",kind:"note",note:"Added context (Your input)"});
      toast("Your input saved","success"); render(); } break;
    case "regen": if(o){
      o.events.push({at:todayISO(),actor:"Mercer",kind:"note",note:"Analysis regenerated with your saved input"});
      if(!o.rationale.some(x=>x.startsWith("Regenerated"))) o.rationale.push(`Regenerated ${fmtDate(todayISO())} folding in your saved input.`);
      toast("Analysis regenerated with your input","success"); render(); } break;
    case "approve": if(o){
      o.status="accepted";
      o.events.push({at:todayISO(),actor:"Maria Vance",kind:"qualified",note:"Approved — moved to Act"});
      S.panelOpen=false; S.tab="act";
      toast(`${o.id} approved — run the play to commit the value`,"success"); render(); } break;
    case "req-reject": S.bulkKind=null; S.dlg.rejReason=""; S.dlg.rejNote=""; S.rejectOpen=true; render(); break;
    case "req-park": S.bulkKind=null; S.dlg.parkType="condition"; S.dlg.parkDate=""; S.dlg.parkCond=""; S.dlg.parkOther=""; S.parkOpen=true; render(); break;
    case "park-type": S.dlg.parkType=t.dataset.v; render(); break;
    case "park-confirm": {
      const d=S.dlg; const trigger = d.parkType==="date"?d.parkDate:(d.parkCond==="Other (specify)"?d.parkOther.trim():d.parkCond);
      const visible = new Set(feedRows().map(x=>x.id));
      const ids = S.bulkKind==="park" ? [...S.sel].filter(id=>visible.has(id)) : [S.activeId];
      ids.forEach(id=>{ const x=oppById(id); if(!x) return; x.status="parked"; x.parkTrigger=trigger;
        x.events.push({at:todayISO(),actor:"Maria Vance",kind:"parked",note:"Revisit: "+trigger}); beginResolve(id,"parked"); });
      S.parkOpen=false; S.panelOpen=false; S.bulkKind=null; S.sel.clear();
      toast(`Parked ${ids.length>1?ids.length+" opportunities":ids[0]} — revisit: ${trigger}`,"info"); render(); break; }
    case "reject-confirm": {
      const d=S.dlg; const reason = d.rejReason==="Other (specify)"?d.rejNote.trim():d.rejReason;
      const visible = new Set(feedRows().map(x=>x.id));
      const ids = S.bulkKind==="reject" ? [...S.sel].filter(id=>visible.has(id)) : [S.activeId];
      ids.forEach(id=>{ const x=oppById(id); if(!x) return; x.status="rejected"; x.rejectReason=reason;
        x.events.push({at:todayISO(),actor:"Maria Vance",kind:"rejected",note:reason}); beginResolve(id,"rejected"); });
      S.rejectOpen=false; S.panelOpen=false; S.bulkKind=null; S.sel.clear();
      toast(`Rejected ${ids.length>1?ids.length+" opportunities":ids[0]} — logged for sweep calibration`,"info"); render(); break; }
    case "dlg-cancel": S.parkOpen=false; S.rejectOpen=false; S.bulkKind=null; render(); break;
    case "unpark": if(o){ o.status="qualified"; o.parkTrigger=null;
      o.events.push({at:todayISO(),actor:"Maria Vance",kind:"note",note:"Returned to feed"});
      S.panelOpen=false; toast("Returned to feed","success"); render(); } break;
    case "close-panel": S.panelOpen=false; S.overrideOpen=false; S.inputOpen=false; render(); break;
    case "close-top": closeTop(); break;
    case "goto-tracking-opp": S.panelOpen=false; S.screen="tracking"; S.trackActive=S.activeId; S.trackPanel=true; render(); break;
    case "open-qualify-ro": S.trackPanel=false; S.activeId=S.trackActive; S.panelOpen=true; render(); break;
    /* act */
    case "open-act": S.panelOpen=false; S.actOpen=true; S.actDraft={timing:"",basis:"",draftKind:null,draftText:""}; render(); break;
    case "close-act": S.actOpen=false; render(); break;
    case "pick-approach": if(o){ o.play.approach=t.dataset.pb; render(); } break;
    case "toggle-task": if(o){ const task=t.dataset.task; const i=o.play.done.indexOf(task);
      i>=0?o.play.done.splice(i,1):o.play.done.push(task); render(); } break;
    case "save-play": toast("Progress saved","success"); break;
    case "draft": if(o){ const r=resolveSavings(o); const anchor=o.roster.find(v=>v.win);
      S.actDraft.draftKind=t.dataset.kind;
      S.actDraft.draftText = t.dataset.kind==="outreach"?outreachDraft(o,r,anchor?anchor.n:null):rfpDraft(o,r); render(); } break;
    case "commit": if(o && S.actDraft.timing && S.actDraft.basis){
      const r=resolveSavings(o);
      o.status="committed"; o.live=false;
      o.committed={ at:todayISO(), timing:S.actDraft.timing, basis:S.actDraft.basis, by:"Maria Vance" };
      o.events.push({at:todayISO(),actor:"Maria Vance",kind:"committed",note:`${S.actDraft.timing} · ${S.actDraft.basis} · range ${fmtRange(r.lo,r.hi)}`});
      S.actOpen=false;
      toast(`${o.id} committed (${fmtRange(r.lo,r.hi)})`,"success","Track in Value Realization →","tracking"); render(); } break;
    /* tracking */
    case "track-tab": S.trackTab=t.dataset.tab; render(); break;
    case "open-track": S.trackActive=t.dataset.id; S.trackPanel=true; render(); break;
    case "toggle-live": { const x=oppById(S.trackActive); if(x){
      x.live=!x.live; x.status = x.live?"in-execution":"committed";
      x.events.push({at:todayISO(),actor:"Maria Vance",kind:"stage-advanced",note:x.live?"Marked live — execution started":"Marked not started"});
      toast(x.live?`${x.id} marked live`:`${x.id} marked not started`,"info"); render(); } break; }
    case "drift-adjust": { const x=oppById(S.trackActive); if(x&&x.drift){
      const f = x.drift.factor||0.887;
      /* Scale the WHOLE evidence pack by the same factor — pocket, carve-outs,
         roster — then re-close the sums, so pocket − carve-outs = addressable
         and Σ roster = pocket stay true after the revision (the invariant is
         the product; a drift fix must never break it). */
      x.pocket=+(x.pocket*f).toFixed(2);
      x.exclusions.forEach(e=>{ e.amount=+(e.amount*f).toFixed(2); });
      x.movable=+(x.pocket - x.exclusions.reduce((s,e)=>s+e.amount,0)).toFixed(2);
      x.savLo=+(x.savLo*f).toFixed(2); x.savHi=+(x.savHi*f).toFixed(2);
      x.roster.forEach(v=>{ v.s=+(v.s*f).toFixed(2); if(v.at)v.at=+(v.at*f).toFixed(2); if(v.aoh)v.aoh=+(v.aoh*f).toFixed(2); });
      const rDiff=+(x.pocket - x.roster.reduce((s,v)=>s+v.s,0)).toFixed(2);
      if(Math.abs(rDiff)>0.005){ const last=x.roster[x.roster.length-1]; last.s=+(last.s+rDiff).toFixed(2); }
      x.rosterTotal=x.roster.reduce((s,v)=>s+v.s,0);
      x.drift.flagged=false;
      x.events.push({at:todayISO(),actor:"Maria Vance",kind:"drift-cleared",note:`Revised figures applied — evidence pack rescaled; committed range re-derived to ${fmtRange(x.savLo,x.savHi)}`});
      toast(`${x.id}: revised figures applied — range ${fmtRange(x.savLo,x.savHi)}`,"success"); render(); } break; }
    case "drift-reaffirm": { const x=oppById(S.trackActive); if(x&&x.drift){
      x.drift.flagged=false;
      x.events.push({at:todayISO(),actor:"Maria Vance",kind:"drift-cleared",note:"Commitment re-affirmed — baseline held despite the drift"});
      toast(`${x.id}: commitment re-affirmed`,"info"); render(); } break; }
    case "drift-escalate": { const x=oppById(S.trackActive); if(x){
      x.events.push({at:todayISO(),actor:"Maria Vance",kind:"note",note:"Escalated to the category lead — drift held open"});
      toast(`${x.id}: escalated — drift stays flagged`,"info"); render(); } break; }
    case "sap-post": { let posted=0;
      trackedOpps().filter(x=>x.live).forEach(x=>{
        const start=parseQ(x.committed?.timing||""); if(!start) return;
        const q = RAMP_QUARTERS.find(qs=>{ const qi=parseQ(qs).idx;
          return qi>=start.idx && qi<start.idx+4 && !(x.actuals||[]).some(a=>a.q===qs); });
        if(q){ x.actuals=x.actuals||[]; const amt=Math.round(resolveSavings(x).mid/4); x.actuals.push({q,amt}); posted++;
          x.events.push({at:todayISO(),actor:"Mercer",kind:"note",note:`${q} actual posted: ${fmtC(amt)} (demo · simulated SAP)`}); } });
      toast(posted?`Posted next quarter for ${posted} live ${posted===1?"play":"plays"} — on-pace, demo data`:"No live play has an open quarter","info"); S.demoOpen=false; render(); break; }
    case "sap-reset": OPPS.forEach(x=>{ x.actuals=(initialActuals[x.id]||[]).map(a=>({...a})); });
      toast("Demo actuals reset","info"); S.demoOpen=false; render(); break;
    /* vendors */
    case "open-vendor": S.vActive=t.dataset.id; S.vPanel=true; S.vEdit={lead:"",terms:""}; render(); break;
    case "v-overlap": S.vf.overlap=!S.vf.overlap; render(); break;
    case "v-clear": S.vf={q:"",role:null,l2:null,entity:null,overlap:false}; render(); break;
    case "ve-save": { const v=VENDORS.find(x=>x.id===S.vActive); if(v){
      const old=v.score;
      if(S.vEdit.lead!=="") v.lead = S.vEdit.lead===""?null:Math.max(0,Math.round(Number(S.vEdit.lead)));
      if(S.vEdit.terms!=="") v.terms = S.vEdit.terms===""?null:Math.max(0,Math.round(Number(S.vEdit.terms)));
      v.dc=dcBreakdown(v); v.score=dcScore(v.dc);
      v.events.push({at:todayISO(),actor:"Maria Vance",note:`Updated operational data — data confidence ${old} → ${v.score}`});
      S.vEdit={lead:"",terms:""};
      toast(`${v.n}: data confidence ${old} → ${v.score}`,"success"); render(); } break; }
    /* methodology */
    case "msec": S.mSec=t.dataset.sec; render(); break;
    case "mdiscard": S.mDraft={}; S.mRaw={}; render(); break;
    case "msave": { if(mInvalidCount()||!Object.keys(S.mDraft).length) break;
      const n=Object.keys(S.mDraft).length;
      Object.entries(S.mDraft).forEach(([k,v])=>{ const p=PARAMS.find(x=>x.key===k); if(p) p.value=v; });
      S.mDraft={}; S.mRaw={}; S.mVersion="v1.3 (draft)"; S.mSavedNote=`Saved ${n} parameter change${n===1?"":"s"}.`;
      toast(`Saved ${n} parameter change${n===1?"":"s"} — applied on the engine's next run`,"success"); render(); break; }
    /* demo */
    case "demo-toggle": S.demoOpen=!S.demoOpen; render(); break;
    case "demo-error": S.dataError=!S.dataError; S.demoOpen=false; closeAllModals(); render(); break;
    case "demo-retry": S.dataError=false; toast("Data service recovered — sweep loaded","success"); render(); break;
    case "demo-reset": try{ location.reload(); }catch(err){} break;
  }
}

function onChange(e){
  const t=e.target; if(!t.dataset||!t.dataset.in) return;
  handleInput(t, true);
}
function onInput(e){
  const t=e.target; if(!t.dataset||!t.dataset.in) return;
  const k=t.dataset.in;
  /* free-text state that shouldn't re-render per keystroke */
  if (k==="mercer-q"){ S.mercerInput=t.value; return; }
  if (k==="draft-text"){ S.actDraft.draftText=t.value; return; }
  if (["yi-context","yi-market","yi-vendor","park-other","rej-note","ov-a","ov-p","q","vq","ve-lead","ve-terms","mparam","mparam-lo","mparam-hi","park-date"].includes(k)){
    handleInput(t, true);
  }
}
function handleInput(t, rerender){
  const k=t.dataset.in, v=t.value;
  switch(k){
    case "l2": S.f.l2 = v||null; S.sel.clear(); break;
    case "sort": S.sort = v; S.sortDir="desc"; break;
    case "q": S.f.q = v; S.sel.clear(); break;
    case "lever": S.f.lever = v||null; S.sel.clear(); break;
    case "country": S.f.country = v||null; S.sel.clear(); break;
    case "yi-context": if(S.inputDraft) S.inputDraft.context=v; break;
    case "yi-market": if(S.inputDraft) S.inputDraft.marketIntel=v; break;
    case "yi-vendor": if(S.inputDraft) S.inputDraft.vendorNotes=v; break;
    case "ov-a": S.ovDraft.a = v.replace(/[^\d]/g,""); break;
    case "ov-p": S.ovDraft.p = v; break;
    case "park-date": S.dlg.parkDate=v; break;
    case "park-cond": S.dlg.parkCond=v; if(v!=="Other (specify)") S.dlg.parkOther=""; break;
    case "park-other": S.dlg.parkOther=v; break;
    case "rej-reason": S.dlg.rejReason=v; if(v!=="Other (specify)") S.dlg.rejNote=""; break;
    case "rej-note": S.dlg.rejNote=v; break;
    case "act-timing": S.actDraft.timing=v; break;
    case "act-basis": S.actDraft.basis=v; break;
    case "vq": S.vf.q=v; break;
    case "vrole": S.vf.role=v||null; break;
    case "vl2": S.vf.l2=v||null; break;
    case "vent": S.vf.entity=v||null; break;
    case "ve-lead": S.vEdit.lead=v; break;
    case "ve-terms": S.vEdit.terms=v; break;
    /* Methodology dials: always keep what the user typed (S.mRaw), validate at
       render (red border + inline error), and only mirror VALID, changed values
       into S.mDraft — never snap the field back mid-edit. */
    case "mparam": { const key=t.dataset.key; const p=PARAMS.find(x=>x.key===key); if(!p) break;
      if (v===String(p.value)){ delete S.mRaw[key]; delete S.mDraft[key]; break; }
      S.mRaw[key]=v;
      const num=Number(v);
      if(v!==""&&Number.isFinite(num)&&num>=0) S.mDraft[key]=num; else delete S.mDraft[key];
      break; }
    case "mparam-lo": case "mparam-hi": { const key=t.dataset.key; const p=PARAMS.find(x=>x.key===key); if(!p) break;
      const raw = S.mRaw[key] ? { ...S.mRaw[key] } : { lo:String(p.value[0]), hi:String(p.value[1]) };
      raw[k==="mparam-lo"?"lo":"hi"]=v;
      if (raw.lo===String(p.value[0]) && raw.hi===String(p.value[1])){ delete S.mRaw[key]; delete S.mDraft[key]; break; }
      S.mRaw[key]=raw;
      const lo=Number(raw.lo), hi=Number(raw.hi);
      if (raw.lo!==""&&raw.hi!==""&&Number.isFinite(lo)&&Number.isFinite(hi)&&lo>=0&&hi<=1&&lo<=hi) S.mDraft[key]=[lo,hi];
      else delete S.mDraft[key];
      break; }
    default: return;
  }
  if (rerender) render();
}

/* Focus-preserving render wrapper. */
const _renderCore = render;
render = function(){
  const ae = document.activeElement;
  let restore = null;
  if (ae && ae.dataset && ae.dataset.in){
    restore = { in:ae.dataset.in, key:ae.dataset.key||null, pos:(typeof ae.selectionStart==="number")?ae.selectionStart:null };
  }
  _renderCore();
  if (restore){
    const sel = restore.key ? `[data-in="${restore.in}"][data-key="${restore.key}"]` : `[data-in="${restore.in}"]`;
    const el2 = document.querySelector(sel);
    if (el2){ el2.focus(); try{ if(restore.pos!=null && el2.setSelectionRange) el2.setSelectionRange(restore.pos, restore.pos); }catch(err){} }
  }
};

if (document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
/* Test hook */
window.__NL = { S, OPPS, VENDORS, PARAMS, render:()=>render(), resolveSavings, feedRows, committedMid, realizedTotal, identifiedMid, dcScore, dcBreakdown };
</script>
