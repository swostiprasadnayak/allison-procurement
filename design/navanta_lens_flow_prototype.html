<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navanta Lens — Opportunity Flow Prototype (Blueprint v3)</title>
<style>
/* ===== Navanta DS tokens (matching @navanta-ai/design-system v0.4.x) ===== */
:root{
  --background:#ffffff; --foreground:#09090b;
  --primary:#232122; --primary-foreground:#ffffff;
  --accent:#6440b6; --accent-soft:#f5efff;
  --christy:linear-gradient(154.42deg,#1d4a86 1.66%,#3d348b 83.4%);
  --muted:#f4f4f5; --muted-2:#fafafa;
  --border:#e4e4e7; --border-2:#d4d4d8;
  --text-2:#52525b; --text-3:#8b8b94;
  --pill-info-bg:#eff6ff; --pill-info-fg:#1e40af;
  --pill-danger-bg:#fff1f2; --pill-danger-fg:#a7000f;
  --pill-warning-bg:#fffbeb; --pill-warning-fg:#92400e;
  --pill-neutral-bg:#f4f4f5; --pill-neutral-fg:#52525b;
  --good:#1e7d4f; --good-bg:#e7f4ed;
  --bad:#a7000f; --bad-bg:#fff1f2;
  --warn:#92400e; --warn-bg:#fffbeb;
  --blue:#1d4a86; --blue-bg:#eaf1fb;
  --shadow:0 4px 24px rgba(9,9,11,.10);
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:#fafafa;color:var(--foreground);font-size:14px;line-height:1.5}
button{font:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;color:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* ===== Topbar ===== */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;background:#fff;border-bottom:1px solid var(--border);padding:0 22px;height:54px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand .logo{width:22px;height:22px;border-radius:6px;background:var(--christy);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800}
.nav{display:flex;gap:4px;margin-left:8px}
.nav button{padding:7px 13px;border-radius:8px;font-weight:600;color:var(--text-2);font-size:13.5px}
.nav button:hover{background:var(--muted)}
.nav button.on{background:var(--primary);color:#fff}
.nav button .ct{display:inline-block;min-width:17px;padding:0 5px;margin-left:6px;border-radius:99px;background:rgba(255,255,255,.22);font-size:10.5px;font-weight:800;text-align:center}
.nav button:not(.on) .ct{background:var(--muted);color:var(--text-2)}
.scopewrap{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-3)}
.scopewrap select{border:1px solid var(--border);border-radius:8px;padding:6px 9px;background:#fff;font-size:12.5px;font-weight:600;color:var(--foreground)}

/* ===== Layout ===== */
.page{max-width:1460px;margin:0 auto;padding:20px 22px 90px}

/* ===== Buttons (DS) ===== */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:8px 14px;font-weight:600;font-size:13px;border:1px solid transparent;white-space:nowrap}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:#3a3738}
.btn.christy{background:var(--christy);color:#fff}
.btn.outline{background:#fff;border-color:var(--border-2);color:var(--foreground)}
.btn.outline:hover{background:var(--muted)}
.btn.ghost{color:var(--text-2)}
.btn.ghost:hover{background:var(--muted)}
.btn.danger{background:#fff;border-color:#f3c1c6;color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.gatehint{font-size:11.5px;color:var(--bad);font-weight:600}

/* ===== Pills ===== */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill.info{background:var(--pill-info-bg);color:var(--pill-info-fg)}
.pill.danger{background:var(--pill-danger-bg);color:var(--pill-danger-fg)}
.pill.warning{background:var(--pill-warning-bg);color:var(--pill-warning-fg)}
.pill.neutral{background:var(--pill-neutral-bg);color:var(--pill-neutral-fg)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.xs{font-size:10px;padding:1px 7px}

/* ===== Cards ===== */
.card{background:#fff;border:1px solid var(--border);border-radius:14px}
.cardpad{padding:16px 18px}

/* ===== Mercer Brief ===== */
.brief{border:1px solid #e6ddf6;background:linear-gradient(180deg,#faf7ff, #fff);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.brief .bhead{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.bstar{width:20px;height:20px;border-radius:6px;background:var(--christy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.brief .bhead b{font-size:14.5px}
.brief .stamp{margin-left:auto;font-size:12px;color:var(--text-3)}
.brief .narr{font-size:13.5px;color:var(--text-2);max-width:1000px}
.brief .honored{margin-top:6px;font-size:12.5px;color:var(--good);font-weight:600}
.bcards{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}
.bcard{flex:1;min-width:150px;background:#fff;border:1px solid var(--border);border-radius:11px;padding:10px 14px}
.bcard .l{font-size:11px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.bcard .v{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-top:1px}
.bcard .d{font-size:11.5px;color:var(--text-3)}
.sweepbtn{margin-top:12px;display:flex;align-items:center;gap:10px}
.sweepbtn .note{font-size:12px;color:var(--text-3)}

/* ===== Feed toolbar ===== */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 10px}
.toolbar input[type=text]{border:1px solid var(--border);border-radius:9px;padding:8px 12px;width:280px;background:#fff}
.toolbar select{border:1px solid var(--border);border-radius:9px;padding:8px 10px;background:#fff;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:99px;background:#fff;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.ranknote{font-size:12.5px;color:var(--text-3);margin:2px 0 8px}
.ranknote b{color:var(--text-2)}

/* ===== Tabs ===== */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:8px 0 0}
.tabs button{padding:9px 15px;font-weight:600;font-size:13.5px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--foreground);border-bottom-color:var(--primary)}
.tabs .ct{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:99px;background:var(--muted);font-size:10.5px;font-weight:800;text-align:center;color:var(--text-2)}

/* ===== Bulk bar ===== */
.bulkbar{display:flex;align-items:center;gap:10px;background:var(--primary);color:#fff;border-radius:11px;padding:9px 14px;margin:10px 0;font-size:13px}
.bulkbar .btn.outline{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.bulkbar .btn.outline:hover{background:rgba(255,255,255,.12)}

/* ===== Table ===== */
.tblwrap{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-top:10px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--muted-2);border-bottom:1px solid var(--border);text-align:left;padding:9px 12px;font-size:11.5px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;user-select:none}
.tbl th.sortable{cursor:pointer}
.tbl th.sortable:hover{color:var(--foreground)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tbody tr.row{cursor:pointer}
.tbl tbody tr.row:hover td{background:#f8f7fb}
.tbl .r{text-align:right}
.tbl .oppname{font-weight:600}
.tbl .sub{display:block;font-size:11.5px;color:var(--text-3);font-weight:400;margin-top:1px}
.tbl .sub.rej{color:var(--bad)}
.grouphead td{background:var(--muted-2);font-weight:700;font-size:12px;color:var(--text-2);padding:7px 12px}
.grouphead .gsum{float:right;font-weight:600;color:var(--text-3)}
.unread{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:1px}
.readgap{display:inline-block;width:14px}
.cm{display:flex;align-items:center;gap:7px;justify-content:flex-end}
.cm .bar{width:54px;height:6px;border-radius:3px;background:var(--muted);overflow:hidden}
.cm .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#89a9e5 0%,#89a9e5 54%,#234687 100%)}
.emptystate{padding:44px;text-align:center;color:var(--text-3)}
.emptystate .big{font-size:15px;font-weight:700;color:var(--text-2);margin-bottom:4px}

/* ===== Modal ===== */
.overlay{position:fixed;inset:0;background:rgba(15,18,34,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:34px 20px}
.modal{background:#fff;border-radius:16px;width:min(1020px,100%);max-height:calc(100vh - 68px);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.mhead{display:flex;align-items:center;gap:12px;padding:16px 22px 12px;border-bottom:1px solid var(--border)}
.mhead .ic{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:16px}
.mhead h2{font-size:18px;letter-spacing:-.01em}
.mhead .meta{display:flex;gap:8px;align-items:center;margin-top:3px;flex-wrap:wrap}
.mhead .chipg{background:var(--muted);border-radius:7px;padding:2px 9px;font-size:11.5px;font-weight:600;color:var(--text-2)}
.mhead .navx{margin-left:auto;display:flex;align-items:center;gap:6px}
.mhead .navx .pos{font-size:11.5px;color:var(--text-3);margin:0 4px}
.iconbtn{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);border:1px solid var(--border);background:#fff;font-size:13px}
.iconbtn:hover{background:var(--muted)}
.iconbtn:disabled{opacity:.35;cursor:not-allowed}
.mtabs{display:flex;gap:2px;padding:0 22px;border-bottom:1px solid var(--border)}
.mtabs button{padding:9px 13px;font-weight:600;font-size:12.5px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.mtabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.mbody{overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.mbody>*{flex-shrink:0}
.mfoot{display:flex;align-items:center;gap:9px;padding:13px 22px;border-top:1px solid var(--border)}
.mfoot .spacer{flex:1}

/* Mercer summary band */
.msum{background:var(--accent-soft);border:1px solid #e6ddf6;border-radius:12px;padding:13px 16px}
.msum .h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;margin-bottom:5px}
.msum p{font-size:13px;color:#3f3564}
.msum .why{margin-top:7px;font-size:12.5px}
.msum .why button{color:var(--accent);font-weight:700;font-size:12px}
.msum ul{margin:7px 0 0 17px;font-size:12.5px;color:#3f3564}
.msum ul li{margin:3px 0}

/* KPI tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{border:1px solid var(--border);border-radius:11px;padding:10px 13px;background:#fff}
.tile .l{font-size:11px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-size:18px;font-weight:700;margin-top:1px}
.tile .d{font-size:11.5px;color:var(--text-3)}
.tile.link{cursor:pointer}
.tile.link:hover{border-color:var(--accent)}
.tile .lin{font-size:10.5px;color:var(--accent);font-weight:700;margin-top:3px}

/* Evidence blocks */
.eb{border:1px solid var(--border);border-radius:12px;background:#fff}
.eb .ehead{display:flex;align-items:center;gap:9px;padding:11px 15px;border-bottom:1px solid var(--border);font-weight:700;font-size:13px}
.eb .ehead .right{margin-left:auto;font-size:11.5px;color:var(--text-3);font-weight:500}
.eb .ebody{padding:13px 15px}
.eb table{width:100%;border-collapse:collapse;font-size:12.5px}
.eb table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);padding:4px 8px;border-bottom:1px solid var(--border)}
.eb table td{padding:7px 8px;border-bottom:1px solid #f0f0f2}
.eb table tr:last-child td{border-bottom:none}
.sharebar{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--muted);vertical-align:2px;margin-right:6px;overflow:hidden}
.sharebar i{display:block;height:100%;background:var(--blue)}
.vlink{color:var(--blue);font-weight:600;cursor:pointer}
.vlink:hover{text-decoration:underline}

/* pricing evidence */
.pe .bridge{display:flex;gap:0;align-items:stretch;flex-wrap:wrap;margin-top:4px}
.pe .bstep{flex:1;min-width:130px;padding:9px 12px;border:1px solid var(--border);background:var(--muted-2)}
.pe .bstep:first-child{border-radius:9px 0 0 9px}
.pe .bstep:last-child{border-radius:0 9px 9px 0;background:var(--good-bg);border-color:#cfe7da}
.pe .bstep .l{font-size:10.5px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.pe .bstep .v{font-size:15.5px;font-weight:700}
.pe .bstep .d{font-size:11px;color:var(--text-3)}
.pe .src{font-size:11.5px;color:var(--text-3);margin-top:8px}

/* waterfall */
.wf .row{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px dashed #ececef;font-size:13px}
.wf .row:last-child{border-bottom:none}
.wf .lbl{flex:1}.wf .lbl .rsn{display:block;font-size:11.5px;color:var(--text-3)}
.wf .amt{font-weight:700}
.wf .neg{color:var(--bad)}
.wf .tot{background:var(--muted-2);border-radius:8px;padding:7px 10px;margin:4px -10px 0;border-bottom:none}
.wf .clicky{cursor:pointer}
.wf .clicky:hover .lbl{color:var(--accent)}

/* fit */
.fit .frow{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed #ececef;font-size:12.5px;align-items:flex-start}
.fit .frow:last-child{border-bottom:none}
.fit .fl{width:190px;font-weight:600;flex-shrink:0}

/* derivation */
.derive .formula{font-family:var(--mono);font-size:12.5px;background:var(--muted-2);border:1px solid var(--border);border-radius:9px;padding:9px 12px;margin-bottom:10px}

/* input / override */
.uin textarea{width:100%;min-height:64px;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13px;resize:vertical}
.uin .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.uin label{font-size:11.5px;font-weight:700;color:var(--text-2);display:block;margin-bottom:3px}
.uin input[type=number],.uin input[type=text],.uin input[type=date]{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px}
.diffbox{border:1px solid #cfe7da;background:var(--good-bg);border-radius:10px;padding:11px 14px;font-size:12.5px}
.diffbox .dr{display:flex;gap:10px;padding:3px 0}
.diffbox .dl{width:150px;font-weight:600}
.diffbox .old{color:var(--text-3);text-decoration:line-through}
.diffbox .new{font-weight:700;color:var(--good)}

/* history */
.hist .ev{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed #ececef;font-size:12.5px}
.hist .ev:last-child{border-bottom:none}
.hist .dot{width:8px;height:8px;border-radius:50%;background:var(--border-2);margin-top:5px;flex-shrink:0}
.hist .ev.k-committed .dot,.hist .ev.k-realized .dot{background:var(--good)}
.hist .ev.k-rejected .dot{background:var(--bad)}
.hist .ev.k-parked .dot{background:var(--warn)}
.hist .ev .who{color:var(--text-3)}

/* status bands */
.band{border-radius:11px;padding:11px 15px;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.band.parked{background:var(--warn-bg);border:1px solid #f0e0b8;color:var(--warn)}
.band.rejected{background:var(--bad-bg);border:1px solid #f3c1c6;color:var(--bad)}
.band.tracked{background:var(--good-bg);border:1px solid #cfe7da;color:var(--good)}
.band b{font-weight:700}
.band .sp{flex:1}

/* alerts */
.alert{border-radius:11px;padding:10px 14px;font-size:12.5px;border:1px solid}
.alert.warn{background:var(--warn-bg);border-color:#f0e0b8;color:var(--warn)}
.alert.info{background:var(--blue-bg);border-color:#d5e3f5;color:var(--blue)}
.alert.drift{background:var(--bad-bg);border-color:#f3c1c6;color:var(--bad)}

/* ===== Act workspace ===== */
.act .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act .pb{border:1.5px solid var(--border);border-radius:11px;padding:11px 13px;cursor:pointer;background:#fff}
.act .pb.on{border-color:var(--accent);background:var(--accent-soft)}
.act .pb .t{font-weight:700;font-size:13px}
.act .pb .s{font-size:11.5px;color:var(--text-3);margin-top:2px}
.act .task{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:13px;cursor:pointer;border-bottom:1px dashed #ececef}
.act .task:last-child{border-bottom:none}
.act .task .box{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--border-2);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex-shrink:0}
.act .task.done .box{background:var(--good);border-color:var(--good)}
.act .task.done span{color:var(--text-3);text-decoration:line-through}
.vchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.vchip{border:1px solid var(--border);border-radius:99px;padding:3px 11px;font-size:11.5px;font-weight:700;color:var(--text-2);background:#fff;cursor:pointer}
.vchip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.vchip .by{font-weight:500;color:var(--text-3)}
.draftarea{width:100%;min-height:170px;border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-family:var(--mono);font-size:12px;line-height:1.55;resize:vertical}
.analysis{background:var(--accent-soft);border:1px solid #e6ddf6;border-radius:10px;padding:10px 14px;font-size:12.5px}
.analysis ul{margin:4px 0 0 16px}
.analysis li{margin:3px 0}
.evitem{display:flex;gap:8px;font-size:12.5px;padding:6px 0;border-bottom:1px dashed #ececef}
.evitem .tag{flex-shrink:0}

/* ===== Tracking / VR ===== */
.vr .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.vr .plays{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.vr .plist .prow{border:1px solid var(--border);border-radius:11px;background:#fff;padding:11px 14px;margin-bottom:9px;cursor:pointer}
.vr .plist .prow:hover{border-color:var(--accent)}
.vr .plist .prow.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.vr .prow .t{font-weight:700;font-size:13px}
.vr .prow .meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.ramp{display:flex;gap:10px;align-items:flex-end;height:150px;padding:14px 6px 4px}
.ramp .q{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.ramp .bars{display:flex;gap:4px;align-items:flex-end;height:104px}
.ramp .bar{width:22px;border-radius:4px 4px 0 0}
.ramp .bar.proj{background:#c9d8ef;border:1px dashed #8fabd6;border-bottom:none}
.ramp .bar.act{background:linear-gradient(180deg,#234687,#89a9e5)}
.ramp .ql{font-size:10.5px;color:var(--text-3);font-weight:700}
.ramp .qv{font-size:10px;color:var(--text-2)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--text-3);padding:0 6px 8px}
.legend .sw{display:inline-block;width:14px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.watermark{font-size:11px;color:var(--warn);font-weight:700}
.closure{border:1px solid #cfe7da;background:var(--good-bg);border-radius:12px;padding:13px 16px}
.closure .t{font-weight:800;font-size:13.5px;color:var(--good);margin-bottom:6px}
.closure .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-size:12.5px}
.closure .g .l{font-size:10.5px;color:var(--text-3);text-transform:uppercase;font-weight:700;letter-spacing:.05em}
.closure .g .v{font-weight:700;font-size:15px}

/* ===== Dialogs (small) ===== */
.dlg{background:#fff;border-radius:14px;width:min(520px,94vw);box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:86vh}
.dlg .dhead{padding:15px 20px 4px}
.dlg .dhead h3{font-size:16px}
.dlg .dhead p{font-size:12.5px;color:var(--text-3);margin-top:2px}
.dlg .dbody{padding:12px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.dlg .dfoot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--border)}
.dlg label{font-size:12px;font-weight:700;color:var(--text-2)}
.dlg select,.dlg input[type=date],.dlg input[type=text]{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13px;background:#fff}
.dlg textarea{width:100%;min-height:70px;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13px;resize:vertical}
.seg{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{flex:1;padding:8px;font-weight:600;font-size:12.5px;color:var(--text-2);background:#fff}
.seg button.on{background:var(--primary);color:#fff}
.radio{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;cursor:pointer;font-size:13px}
.radio.on{border-color:var(--accent);background:var(--accent-soft)}
.radio input{margin-top:3px}

/* ===== Mercer dock ===== */
.dock{position:fixed;top:54px;right:0;bottom:0;width:400px;background:#fff;border-left:1px solid var(--border);z-index:70;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(9,9,11,.08)}
.dock .dkhead{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--border)}
.dock .dkhead b{font-size:14px}
.dock .ctx{font-size:11.5px;color:var(--text-3)}
.dock .thread{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;border-radius:12px;padding:9px 13px;font-size:12.5px;line-height:1.5}
.msg.user{align-self:flex-end;background:var(--primary);color:#fff}
.msg.mercer{align-self:flex-start;background:var(--accent-soft);border:1px solid #e6ddf6}
.msg.mercer .cite{display:block;margin-top:6px;font-size:10.5px;color:var(--accent);font-weight:700}
.dock .ask{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--border)}
.dock .ask input{flex:1;border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:13px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.sugg button{border:1px solid var(--border);border-radius:99px;padding:4px 11px;font-size:11.5px;color:var(--text-2);background:#fff}
.sugg button:hover{border-color:var(--accent);color:var(--accent)}

/* ===== Toasts ===== */
.toasts{position:fixed;bottom:18px;right:18px;z-index:100;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--primary);color:#fff;border-radius:11px;padding:11px 16px;font-size:13px;box-shadow:var(--shadow);max-width:380px;animation:tin .25s ease}
.toast.success{background:#14532d}
.toast.warn{background:#7c4a03}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* lineage popover */
.pop{position:fixed;z-index:90;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);width:440px;max-height:380px;overflow:auto}
.pop .phead{display:flex;align-items:center;padding:11px 15px;border-bottom:1px solid var(--border);font-weight:700;font-size:13px}
.pop table{width:100%;font-size:12px;border-collapse:collapse}
.pop td,.pop th{padding:6px 12px;border-bottom:1px solid #f0f0f2;text-align:left}
.pop th{font-size:10.5px;text-transform:uppercase;color:var(--text-3)}
.pop .pfoot{padding:8px 15px;font-size:11px;color:var(--text-3)}

.signalcell{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.sigwhy{font-size:11px;color:var(--text-3)}
mark{background:#fef3c7;border-radius:3px;padding:0 2px}
</style>
</head>

const LEVERS = { consolidate:"Consolidate", rfp:"Competitive RFP", "carve-out":"OEM carve-out", "sub-classify":"Sub-classify" };
const LEVER_VAR = { consolidate:"info", rfp:"neutral", "carve-out":"warning", "sub-classify":"warning" };

function money(n){ if(n==null) return "—"; const a=Math.abs(n);
  if(a>=1e6) return "$"+(n/1e6).toFixed(2)+"M";
  if(a>=1e3) return "$"+(n/1e3).toFixed(n%1e3===0?0:1)+"K";
  return "$"+Math.round(n).toLocaleString(); }
function moneyFull(n){ return "$"+Math.round(n).toLocaleString(); }
function range(lo,hi){ return money(lo)+"–"+money(hi); }
function esc(s){ return String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function el(id){ return document.getElementById(id); }

/* Derived */
function impact(o){ return o.movable * o.conf / 100; }
function resolved(o){
  const addr = o.userInput.overrideAddr ?? o.movable;
  const loPct = o.lo / o.movable, hiPct = o.hi / o.movable;
  const pct = o.userInput.overridePct;
  return {
    addr,
    lo: pct!=null ? addr*pct/100*0.8 : addr*loPct,
    hi: pct!=null ? addr*pct/100 : addr*hiPct,
    overridden: o.userInput.overrideAddr!=null || o.userInput.overridePct!=null
  };
}
function feedRows(){ return S.opps.filter(o=>["surfaced","qualifying","qualified"].includes(o.status)); }
function tabRows(tab){
  if(tab==="feed") return feedRows();
  if(tab==="act") return S.opps.filter(o=>o.status==="accepted");
  if(tab==="parked") return S.opps.filter(o=>o.status==="parked");
  if(tab==="rejected") return S.opps.filter(o=>o.status==="rejected");
  return [];
}
function tracked(){ return S.opps.filter(o=>["committed","in-execution","realized"].includes(o.status)); }
function pushEv(o, kind, note, actor){ o.events.push({ kind, actor: actor||"Maria Vance", at: TODAY, note }); }

/* Toasts */
function toast(msg, kind){ const t=document.createElement("div"); t.className="toast "+(kind||""); t.textContent=msg;
  el("toasts").appendChild(t); setTimeout(()=>{ t.style.opacity="0"; t.style.transition="opacity .3s"; setTimeout(()=>t.remove(),300); }, 3400); }

/* Lineage synth: deterministic pseudo-transactions per figure */
function lineageRows(o, total, tag){
  const vend = o.roster.filter(v=>!v.oem).map(v=>v.name);
  const rows=[]; let rem=total; const n=5;
  for(let i=0;i<n;i++){
    const f = i===n-1 ? rem : Math.round(total*[0.31,0.24,0.19,0.15,0.11][i]);
    rem -= f;
    rows.push({ po:"PO-"+(4100+((o.id.charCodeAt(4)+i*37)%800)), vendor: vend[i%vend.length]||"Various", date:"2026-0"+((i%5)+2)+"-1"+(i+2), amt:f });
  }
  return rows;
}

function filteredSorted(rows){
  let r = rows.filter(o=>{
    if(S.scopeL2 && o.l2!==S.scopeL2) return false;
    if(S.lever && o.route!==S.lever) return false;
    if(S.country && o.country!==S.country) return false;
    if(S.confMin && o.conf<S.confMin) return false;
    if(S.q){ const q=S.q.toLowerCase();
      const hay = [o.id,o.title,o.l2,o.l3,o.country,...o.roster.map(v=>v.name)].join(" ").toLowerCase();
      if(!hay.includes(q)) return false; }
    return true;
  });
  const f=S.sort.field, d=S.sort.dir==="asc"?1:-1;
  const val = o => f==="impact"?impact(o) : f==="savings"?o.hi : f==="pocket"?o.pocket : f==="movable"?o.movable : f==="conf"?o.conf : f==="vendors"?o.vendors : (o[f]||"");
  r.sort((a,b)=>{ const va=val(a), vb=val(b); return (typeof va==="number" ? va-vb : String(va).localeCompare(String(vb)))*d; });
  return r;
}

function sigPill(o){
  if(!o.signal) return "";
  const map={ new:"info", changed:"warning", "new-supplier":"info", "revisit-due":"warning", drift:"danger" };
  return `<div class="signalcell"><span class="pill ${map[o.signal.kind]||"neutral"} xs">${esc(o.signal.label)}</span><span class="sigwhy">${esc(o.signal.why)}</span></div>`;
}

function viewTable(rows){
  const r = filteredSorted(rows);
  if(!r.length) return `<div class="tblwrap"><div class="emptystate"><div class="big">${S.tab==="feed"?"All opportunities reviewed":"Nothing here"}</div>${S.tab==="feed"?"Mercer's next sweep runs at 04:00 — or run the demo sweep above.":"Decisions land here as you make them."}</div></div>`;
  const th = (label, field, right) => `<th class="${field?"sortable":""} ${right?"r":""}" ${field?`data-a="sort" data-v="${field}"`:""}>${label}${S.sort.field===field?(S.sort.dir==="desc"?" ↓":" ↑"):""}</th>`;
  const groups = S.tab==="feed" && S.groupBy!=="none"
    ? Object.entries(r.reduce((m,o)=>{ const k = S.groupBy==="route"?LEVERS[o.route]:o[S.groupBy]; (m[k]=m[k]||[]).push(o); return m; },{}))
    : [[null, r]];
  const isFeed = S.tab==="feed";
  let body = "";
  groups.forEach(([g, list])=>{
    if(g) body += `<tr class="grouphead"><td colspan="11">${esc(g)} · ${list.length}<span class="gsum">${money(list.reduce((s,o)=>s+o.movable,0))} addressable</span></td></tr>`;
    list.forEach(o=>{
      const parkedDue = o.parkTrigger && o.parkTrigger.due;
      body += `<tr class="row" data-a="open" data-id="${o.id}">
        ${isFeed?`<td><input type="checkbox" data-a="selrow" data-id="${o.id}" ${S.sel.has(o.id)?"checked":""}></td>`:""}
        <td class="oppname">${isFeed?(o.read?'<span class="readgap"></span>':'<span class="unread"></span>'):""}${esc(o.l3)} <span style="color:var(--text-3);font-weight:400">· ${esc(o.id)}</span>
          ${o.status==="rejected"?`<span class="sub rej">Rejected · ${esc(o.rejectReason||"")}</span>`:`<span class="sub">${esc(o.l2)}</span>`}
        </td>
        ${isFeed?`<td>${sigPill(o)}</td>`:""}
        ${S.tab==="parked"?`<td>${o.parkTrigger?`<span class="pill ${parkedDue?"warning":"neutral"} xs">${parkedDue?"⏰ Due — ":""}${esc(o.parkTrigger.label)}</span>`:"—"}</td>`:""}
        <td>${esc(o.country)}</td>
        <td><span class="pill ${LEVER_VAR[o.route]}">${LEVERS[o.route]}</span></td>
        <td><span class="pill ${o.evidence==="evidence"?"info":"warning"} xs">${o.evidence==="evidence"?"Evidence":"Benchmark"}</span></td>
        <td class="r tnum">${money(o.pocket)}</td>
        <td class="r tnum">${money(o.movable)}</td>
        <td class="r tnum">${o.vendors}</td>
        <td class="r"><span class="cm"><span class="bar"><i style="width:${o.conf}%"></i></span><span class="tnum">${o.conf}%</span></span></td>
        <td class="r tnum"><b>${range(o.lo,o.hi)}</b></td>
      </tr>`;
    });
  });
  return `<div class="tblwrap"><table class="tbl">
    <thead><tr>
      ${isFeed?`<th style="width:34px"><input type="checkbox" data-a="selall" ${r.length&&r.every(o=>S.sel.has(o.id))?"checked":""}></th>`:""}
      ${th("Opportunity","l3")}
      ${isFeed?`<th>Signal</th>`:""}
      ${S.tab==="parked"?`<th>Revisit trigger</th>`:""}
      ${th("Country","country")}
      <th>Lever</th><th>Basis</th>
      ${th("Total spend","pocket",1)}${th("Addressable","movable",1)}${th("Vendors","vendors",1)}${th("Confidence","conf",1)}${th("Savings","savings",1)}
    </tr></thead><tbody>${body}</tbody></table></div>`;
}

function mDiff(o){
  const d=o.regenDiff;

function mDerive(o){
  const gapMult = Math.min(o.gapN,20)/20;
  return `<div class="eb derive"><div class="ehead">Confidence derivation — what drove ${o.conf}%</div><div class="ebody">
    <div class="formula">confidence = functional fit × MIN(fragmentation gap, 20) / 20 = ${o.fit.toFixed(2)} × ${gapMult.toFixed(2)} = ${(o.fit*gapMult).toFixed(2)} → ${o.conf}%</div>
    <table><thead><tr><th>Factor</th><th>Value</th><th>Meaning</th></tr></thead><tbody>

      <tr><td>Fragmentation multiplier</td><td class="tnum">MIN(${o.gapN}, 20) / 20 = ${gapMult.toFixed(2)}</td><td>Gap is capped at 20× — beyond that, more fragmentation no longer lifts confidence.</td></tr>

}

        <div style="display:flex;gap:8px;margin-top:8px;align-items:center">

    <div class="mfoot">

      <button class="btn primary" data-a="commit" data-id="${o.id}" ${canCommit?"":"disabled"}>✓ Commit value</button>

  </div></div>`;
}

/* ================= Value Realization ================= */
function viewVR(){
  const rows = tracked();
  if(!rows.length) return `<div class="card cardpad emptystate"><div class="big">Nothing committed yet</div>Commit opportunities from the feed to start tracking realization.</div>`;
  const sel = S.opps.find(o=>o.id===S.vrSel) || rows[0];
  const committedMid = rows.reduce((s,o)=>s+(o.lo+o.hi)/2,0);
  const realizedTot = rows.reduce((s,o)=>s+o.ramp.reduce((a,q)=>a+(q.actual||0),0),0);
  const anyDemo = rows.some(o=>o.ramp.some(q=>q.demo));
  const driftN = rows.filter(o=>o.drift.flagged).length;
  return `<div class="vr">
    <h2 style="font-size:20px;letter-spacing:-.01em;margin:4px 0 14px">Value Realization — Control Tower</h2>
    <div class="kpis">
      <div class="bcard"><div class="l">Committed (mid)</div><div class="v tnum">${money(committedMid)}</div><div class="d">${rows.length} plays</div></div>
      <div class="bcard"><div class="l">Realized to date</div><div class="v tnum">${money(realizedTot)}</div><div class="d">${anyDemo?'<span class="watermark">⚠ includes illustrative actuals</span>':"posted actuals"}</div></div>
      <div class="bcard"><div class="l">Realization</div><div class="v tnum">${committedMid?Math.round(realizedTot/committedMid*100):0}%</div><div class="d">of committed mid</div></div>
      <div class="bcard"><div class="l">At risk (drift)</div><div class="v tnum" style="color:${driftN?"var(--bad)":"inherit"}">${driftN?money(rows.filter(o=>o.drift.flagged).reduce((s,o)=>s+(o.lo+o.hi)/2,0)):"$0"}</div><div class="d">${driftN||"no"} play${driftN===1?"":"s"} flagged</div></div>
    </div>
    <div class="plays">
      <div class="plist">${rows.map(o=>`<div class="prow ${sel.id===o.id?"on":""}" data-a="vrsel" data-id="${o.id}">
        <div class="t">${esc(o.l3)} · ${esc(o.country)} <span style="color:var(--text-3);font-weight:400">${esc(o.id)}</span></div>
        <div class="meta"><span class="pill ${o.status==="realized"?"good":o.status==="in-execution"?"info":"neutral"} xs">${o.status==="committed"?"Not started":o.status==="in-execution"?"Live":"Realized · closed"}</span>
        <span class="pill neutral xs tnum">${range(o.lo,o.hi)}</span>
        ${o.drift.flagged?'<span class="pill danger xs">⚠ Drift</span>':""}</div>
      </div>`).join("")}</div>
      <div>${vrPanel(sel)}</div>
    </div>
  </div>`;
}

function vrPanel(o){
  const realized = o.ramp.reduce((s,q)=>s+(q.actual||0),0);
  const mid=(o.lo+o.hi)/2;
  const pct = Math.round(realized/mid*100);
  const allPosted = o.ramp.every(q=>q.actual!=null);
  const maxV = Math.max(...o.ramp.map(q=>Math.max(q.proj,q.actual||0)),1);
  return `<div class="card cardpad">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <h3 style="font-size:16px">${esc(o.title)} <span style="color:var(--text-3);font-weight:400">${esc(o.id)}</span></h3>
      <span class="pill ${o.status==="realized"?"good":o.status==="in-execution"?"info":"neutral"}">${o.status==="committed"?"Not started":o.status==="in-execution"?"Live":"Realized"}</span>
      <span style="flex:1"></span>
      ${o.status==="committed"?`<button class="btn primary sm" data-a="marklive" data-id="${o.id}">Mark live</button>`:""}
      ${o.status==="in-execution"?`<button class="btn outline sm" data-a="markback" data-id="${o.id}">Mark not started</button>`:""}
      <button class="btn danger sm" data-a="dlg-uncommit" data-id="${o.id}">Un-commit…</button>
    </div>
    <div style="font-size:12px;color:var(--text-3);margin:2px 0 10px">Committed ${range(o.lo,o.hi)} · ${esc(o.committedAt||TODAY)} · ${esc(o.owner||"Maria Vance")} · basis: ${esc(o.basis||"workbook")}</div>
    ${o.drift.flagged?`<div class="alert drift" style="margin-bottom:10px"><b>⚠ Drift flagged.</b> ${esc(o.drift.note)}

/* ================= Layer: modal / dialogs / dock / popover ================= */
const PARK_CONDS = ["Contract renewal","Next budget cycle","Price movement >5%","Supplier consolidation elsewhere","Volume threshold reached","Other (specify)"];
const REJ_REASONS = ["Non-negotiable counterparty (gov / utility)","Intercompany spend","OEM-locked sole source","Already contracted / in flight","Data quality too low to act","Strategic supplier — do not touch","Other (specify)"];

function renderLayer(){
  const L = el("layer");
  let html = "";
  if(S.act){ const o=byId(S.act); if(o) html += viewAct(o); }
  else if(S.modal){ const o=byId(S.modal); if(o) html += viewModal(o); }
  if(S.dlg) html += viewDialog();
  if(S.pop) html += viewPop();
  if(S.mercer.open) html += viewDock();
  L.innerHTML = html;
  const dt = L.querySelector('[data-in="drafttext"]'); // keep caret sane on re-render
  if(S.focusDraft && dt){ dt.focus(); S.focusDraft=false; }
}

function viewDialog(){
  const d = S.dlg; const o = d.id ? byId(d.id) : null;
  const wrap = inner => `<div class="overlay" style="z-index:80;align-items:center" data-a="dlgcancel"><div class="dlg">${inner}</div></div>`;

  if(d.kind==="park") return wrap(`
    <div class="dhead"><h3>Park ${d.bulk?`${S.sel.size} opportunities`:esc(o.id)}</h3><p>Resurfaces when its revisit trigger fires — the trigger is watched, and Due items get a feed signal.</p></div>
    <div class="dbody">
      <div class="seg"><button class="${d.trigType==="date"?"on":""}" data-a="dlgset" data-k="trigType" data-v="date">Revisit on a date</button><button class="${d.trigType==="cond"?"on":""}" data-a="dlgset" data-k="trigType" data-v="cond">On a condition</button></div>
      ${d.trigType==="date"?`<div><label>Revisit on</label><input type="date" value="${d.date||""}" data-in="dlg-date"></div>`
      :`<div style="display:flex;flex-direction:column;gap:6px">${PARK_CONDS.map(c=>`<label class="radio ${d.cond===c?"on":""}"><input type="radio" name="pc" ${d.cond===c?"checked":""} data-a="dlgset" data-k="cond" data-v="${esc(c)}"> ${esc(c)}</label>`).join("")}
      ${d.cond==="Other (specify)"?`<textarea placeholder="Describe the condition…" data-in="dlg-other">${esc(d.other||"")}</textarea>`:""}</div>`}
    </div>
    <div class="dfoot"><button class="btn outline" data-a="dlgcancel">Cancel</button>
    <button class="btn primary" data-a="park-confirm" ${((d.trigType==="date"&&d.date)||(d.trigType==="cond"&&d.cond&&(d.cond!=="Other (specify)"||d.other)))?"":"disabled"}>Park</button></div>`);

  if(d.kind==="reject") return wrap(`
    <div class="dhead"><h3>Reject ${d.bulk?`${S.sel.size} opportunities`:esc(o.id)}</h3><p>Feeds sweep calibration — the next run honors this and will only re-surface with a "what changed" justification.</p></div>
    <div class="dbody"><div style="display:flex;flex-direction:column;gap:6px">
      ${REJ_REASONS.map(c=>`<label class="radio ${d.reason===c?"on":""}"><input type="radio" name="rr" ${d.reason===c?"checked":""} data-a="dlgset" data-k="reason" data-v="${esc(c)}"> ${esc(c)}</label>`).join("")}</div>
      <div><label>Note ${d.reason==="Other (specify)"?"(required)":"(optional — persisted with the decision)"}</label>
      <textarea data-in="dlg-note" placeholder="Context for the record…">${esc(d.note||"")}</textarea></div>
    </div>
    <div class="dfoot"><button class="btn outline" data-a="dlgcancel">Cancel</button>
    <button class="btn primary" data-a="reject-confirm" ${d.reason&&(d.reason!=="Other (specify)"||(d.note||"").trim())?"":"disabled"}>Reject</button></div>`);

  if(d.kind==="unreject") return wrap(`
    <div class="dhead"><h3>Restore ${esc(o.id)} to the feed</h3><p>Un-rejects with a reason — the full history stays on the record.</p></div>
    <div class="dbody"><div><label>Why restore it? (required)</label><textarea data-in="dlg-note" placeholder="e.g. Tariff structure changed — competitive lever now exists…">${esc(d.note||"")}</textarea></div></div>
    <div class="dfoot"><button class="btn outline" data-a="dlgcancel">Cancel</button>
    <button class="btn primary" data-a="unreject-confirm" ${(d.note||"").trim()?"":"disabled"}>Restore to feed</button></div>`);

  if(d.kind==="uncommit") return wrap(`
    <div class="dhead"><h3>Un-commit ${esc(o.id)}</h3><p>Returns the play to the feed as qualified, restores pre-commit figures, and strips generated milestones. The audit trail keeps everything.</p></div>
    <div class="dbody"><div><label>Reason (required)</label><textarea data-in="dlg-note" placeholder="e.g. Committed on the wrong basis — quote fell through…">${esc(d.note||"")}</textarea></div></div>
    <div class="dfoot"><button class="btn outline" data-a="dlgcancel">Cancel</button>
    <button class="btn danger" data-a="uncommit-confirm" ${(d.note||"").trim()?"":"disabled"}>Un-commit</button></div>`);

  return "";
}

function mercerAnswer(o, q){
  const ql=q.toLowerCase(); const res=o?resolved(o):null;
  if(!o) return { text:"Open an opportunity and I'll ground every answer in its own numbers.", cite:"" };
  if(/lever|consolidat|rfp|route/.test(ql)){
    const w=o.roster.find(v=>v.winner);
    return { text: o.route==="consolidate"
      ? `${w?w.name:"The anchor"} already holds ${w?Math.round(w.share*100):""}% of this pocket — folding the tail onto the incumbent beats competing it, so the engine routed a Consolidate play (winner share ≥ 50%).`
      : `No dominant incumbent here — the largest non-OEM holds ${Math.round((o.roster.find(v=>!v.oem)?.share||0)*100)}% — so the engine routed a Competitive RFP across the non-OEM base (winner share < 50%).`,
      cite:`opp.opportunity · winner_share rule v2026-06 · ${o.id}` };
  }
  if(/confiden|76|71|72|score/.test(ql)) return { text:`Confidence ${o.conf}% = functional fit ${o.fit.toFixed(2)} × MIN(fragmentation gap ${o.gapN}, 20)/20. It tracks the product-vs-services mix — services are harder to should-cost. It's independent of $ size; ranking uses Impact = addressable × confidence.`, cite:"Derivation tab · methodology v0.4" };
  if(/exclud|carve|oem|sole/.test(ql)) return { text:`${money(o.excl.reduce((s,e)=>s+e.amount,0))} is carved out: ${o.excl.map(e=>`${e.label} (${money(e.amount)}) — ${e.reason.toLowerCase()}`).join("; ")}. You can dispute any carve-out from its lineage view.`, cite:"Math tab · exclusions" };
  if(/benchmark|price|unit|index/.test(ql)) return { text:`The ${o.l3} / ${o.country} benchmark is $${o.pe.bench.toFixed(2)} ${o.pe.unit} (category index, Q2-2026). Your blended rate is $${o.pe.blended.toFixed(2)} — a $${o.pe.gap.toFixed(2)} gap. Gap × volume gives an upper bound of ${money(o.pe.gap*o.pe.vol)}; the committed range ${range(res.lo,res.hi)} stays deliberately below it.`, cite:"Pricing evidence tab · index Q2-2026" };
  if(/park|revisit/.test(ql)) return { text:"Parking stores a typed trigger (date or condition). Date triggers are watched — when due, the item gets a 'Revisit due' signal in the feed and you can approve or reject straight from the Parked panel.", cite:"Parked tab behavior" };
  return { text:`${o.summary} The estimated range ${range(res.lo,res.hi)} is 4–7% of the ${money(res.addr)} addressable — see the Pricing evidence tab for the market bridge.`, cite:`${o.id} · Mercer summary` };
}

/* ================= Actions & wiring ================= */
function openOpp(id){
  const o=byId(id);
  if(o.status==="accepted"){ S.act=id; S.modal=null; }
  else {
    S.modal=id; S.modalTab="summary"; S.act=null;
    if(o.status==="surfaced"){ o.status="qualifying"; o.read=true;
      pushEv(o,"note","Assembling evidence pack…","Mercer");
      setTimeout(()=>{ if(o.status==="qualifying"){ o.status="qualified"; pushEv(o,"qualified","Evidence pack assembled","Mercer"); render(); } },1200);
    }
    o.read=true;
  }
  render();
}

function approve(id){
  const o=byId(id);
  if(o.status==="parked"){ o.parkTrigger=null; }
  o.status="accepted";
  pushEv(o,"note","Accepted · moved to Act");
  S.modal=null; S.tab="act";
  toast("Approved — moved to Act. Decision persisted.","success");
  render();
}

function parkConfirm(){
  const d=S.dlg;
  const label = d.trigType==="date" ? "Revisit on "+new Date(d.date+"T00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : (d.cond==="Other (specify)"?d.other:d.cond);
  const trig = { type:d.trigType, value:d.trigType==="date"?d.date:(d.cond==="Other (specify)"?d.other:d.cond), label, due:false };
  const ids = d.bulk ? [...S.sel] : [d.id];
  ids.forEach(id=>{ const o=byId(id); if(!["surfaced","qualifying","qualified","parked"].includes(o.status)) return;
    o.status="parked"; o.parkTrigger={...trig}; pushEv(o,"parked","Revisit: "+label); });
  S.sel.clear(); S.dlg=null; S.modal=null;
  toast(`Parked ${ids.length>1?ids.length+" opportunities":ids[0]} — revisit: ${label}. Trigger is watched.`);
  render();
}

function rejectConfirm(){
  const d=S.dlg; const ids = d.bulk ? [...S.sel] : [d.id];
  ids.forEach(id=>{ const o=byId(id); if(["committed","in-execution","realized","rejected"].includes(o.status)) return;
    o.status="rejected"; o.rejectReason=d.reason; o.rejectNote=(d.note||"").trim(); o.parkTrigger=null;
    pushEv(o,"rejected",d.reason+(d.note?" · note saved":"")); });
  S.sel.clear(); S.dlg=null; S.modal=null;
  toast(`Rejected ${ids.length>1?ids.length+" opportunities":ids[0]} — reason & note persisted; next sweep honors it.`);
  render();
}

function runSweep(){
  S.sweep++;
  // 1. changed signal on OPP-001? it's accepted — use OPP-004 (surfaced): addressable shift
  const c=byId("OPP-004");
  c.movable=Math.round(c.movable*1.15); c.lo=Math.round(c.lo*1.15); c.hi=Math.round(c.hi*1.15);
  c.signal={kind:"changed",label:"Changed",why:"Addressable +15% — two new POs landed"}; c.read=false;
  pushEv(c,"note","Sweep #"+S.sweep+": addressable revised upward — two new POs","Mercer");
  // 2. new-supplier signal on OPP-007
  const n=byId("OPP-007");
  n.signal={kind:"new-supplier",label:"New supplier",why:"Instant Procurement Services entered the pocket"}; n.read=false;
  pushEv(n,"note","Sweep #"+S.sweep+": new supplier detected in pocket","Mercer");
  // 3. parked trigger due
  const p=S.opps.find(o=>o.status==="parked");
  if(p&&p.parkTrigger){ p.parkTrigger.due=true; p.signal={kind:"revisit-due",label:"Revisit due",why:p.parkTrigger.label}; pushEv(p,"note","Revisit trigger fired — awaiting your decision","Mercer"); }
  // 4. drift on a committed play
  const dr=S.opps.find(o=>o.status==="in-execution"||o.status==="committed");
  if(dr&&!dr.drift.flagged){ dr.drift={flagged:true,note:"Data refresh moved this pocket: incumbent share fell 55%→48% and the blended rate rose 3% — committed ramp may be optimistic."};
    pushEv(dr,"drift-flagged","Pocket shifted under a committed play","Mercer"); }
  // 5. honored line
  const r=S.opps.find(o=>o.status==="rejected");
  S.honored = `Decisions honored: ${r?r.id+" stayed suppressed ("+ (r.rejectReason||"").toLowerCase()+")":""} · ${S.opps.filter(o=>o.status==="parked").length} parked item held · nothing you dismissed was re-surfaced.`;
  toast("Sweep #"+S.sweep+" complete — 1 changed, 1 new supplier, 1 revisit due, 1 drift flag.","success");
  render();
}

function analyzeEvidence(o){
  const t=o.play.evNote.toLowerCase(); const out=[]; const pe=o.pe;
  const priceM = t.match(/\$ ?(\d+(?:\.\d+)?)/);
  if(priceM){ const q=parseFloat(priceM[1]);
    const d=Math.round((pe.blended-q)/pe.blended*100);
    out.push(`Quoted <b>$${q.toFixed(2)}</b> vs your blended <b>$${pe.blended.toFixed(2)}</b> — ${d>0?d+"% below your current rate":"above your current rate"} (benchmark $${pe.bench.toFixed(2)}).`);
    if(d>0) out.push(`At ~${pe.vol.toLocaleString()} units, holding this price on the addressable base is worth ≈ <b>${money((pe.blended-q)*pe.vol)}</b> — ${(pe.blended-q)*pe.vol>o.hi?"above":"within"} the committed range ${range(o.lo,o.hi)}.`);
  }
  if(/net ?\d+/.test(t)) out.push(`Payment terms detected (${t.match(/net ?\d+/)[0].toUpperCase()}) — fold into the negotiation asks alongside price.`);
  if(/(\d+)\s?%/.test(t) && /sku|cover/.test(t)) out.push(`Partial SKU coverage noted — keep a second bidder for the uncovered tail to protect continuity.`);
  if(!out.length) out.push("Context noted and saved to the play's evidence. No prices detected — paste the quote's numbers for a rate comparison.");
  o.play.lastAnalysis = out;
  o.play.evidence.push({ type:"quote", title:o.play.evNote.slice(0,60)+(o.play.evNote.length>60?"…":""), into:"draft v"+(o.play.drafts[o.play.draftKind].length+1), at:TODAY+" · analyzed by Mercer" });
  pushDraft(o, o.play.draftKind, "Mercer", "folded evidence: "+o.play.evNote.slice(0,40)+"…");
  o.play.evNote="";
  pushEv(o,"note","Evidence analyzed & folded into "+o.play.draftKind+" draft","Mercer");
  toast("Analyzed — draft v"+o.play.activeVer[o.play.draftKind]+" created from your evidence.","success");
}

function draftTemplate(o, kind, evidenceNote){
  const res=resolved(o); const bidders=o.roster.filter(v=>!v.oem&&v.share>=0.05).map(v=>v.name);
  if(kind==="outreach") return `Subject: ${o.l3} — ${o.country} supply review · Allison Transmission (AT + AOH)

Dear supplier,

Following our post-merger category review of ${o.l3} in ${o.country} (~${money(res.addr)} contestable annual spend), we are consolidating our supply base and reviewing commercial terms.

${evidenceNote?("Based on recent evidence: "+evidenceNote+"\n\n"):""}We'd like to discuss:
• Volume-tiered pricing vs the current blended rate ($${o.pe.blended.toFixed(2)} ${o.pe.unit})
• Payment terms and lead-time commitments
• Coverage of the full SKU range across AT and AOH plants

Please confirm availability this week.

Maria Vance · Category Manager, MRO`;
  return `RFP — ${o.l3} · ${o.country} · Allison Transmission (AT + AOH)

1. BACKGROUND
Post-merger sourcing event covering ~${money(res.addr)} contestable annual spend (${o.vendors} incumbent vendors, top-3 ${Math.round(o.roster.slice(0,3).reduce((s,v)=>s+v.share,0)*100)}% share).

2. SCOPE
Category: ${o.l3} (${o.l2}) · Geography: ${o.country} · OEM/sole-source excluded (${money(o.excl.reduce((s,e)=>s+e.amount,0))}).
${evidenceNote?("\nEVIDENCE BASELINE: "+evidenceNote+"\n"):""}
3. INVITED BIDDERS
${bidders.map(b=>"• "+b).join("\n")}

4. EVALUATION
Price vs benchmark ($${o.pe.bench.toFixed(2)} ${o.pe.unit}) 40% · Terms 20% · Lead time & continuity 20% · SKU coverage 20%.

5. TIMELINE
Q&A one week · Bids due in three · Award decision in five.`;
}

function pushDraft(o, kind, by, note){
  const vers=o.play.drafts[kind];
  const evNote = by==="Mercer"&&vers.length? o.play.evidence[o.play.evidence.length-1]?.title : null;
  const base = vers.length? vers[o.play.activeVer[kind]-1].text : null;
  const text = by==="Mercer" ? draftTemplate(o, kind, evNote) : base;
  vers.push({ v:vers.length+1, by, note, text: by==="Mercer"?text:o.play._editBuf ?? base });
  o.play.activeVer[kind]=vers.length;
}

function commit(id){
  const o=byId(id); const res=resolved(o);
  o.status="committed"; o.stage="committed"; o.committedAt=TODAY; o.owner="Maria Vance";
  o.lo=Math.round(res.lo); o.hi=Math.round(res.hi);
  const mid=(o.lo+o.hi)/2;
  o.ramp=["Q3 26","Q4 26","Q1 27","Q2 27"].map((q,i)=>({q, proj:Math.round(mid*(i+1)/4), actual:null}));
  pushEv(o,"committed",`Committed ${range(o.lo,o.hi)} · ${res.overridden?"operator override":"engine figures"} · basis: ${o.basis}`);
  S.act=null; S.page="vr"; S.vrSel=id;
  toast(o.id+" committed — tracking in Value Realization.","success");
  render();
}

function postQuarter(o){
  const i=o.ramp.findIndex(q=>q.actual==null);
  if(i<0) return;
  const prev=i>0?o.ramp[i-1].actual:0;
  o.ramp[i].actual=Math.round(prev+( (o.lo+o.hi)/2 )/4 * (o.driftAdj?0.92:1));
  o.ramp[i].demo=true;
  pushEv(o,"note",`Actuals posted for ${o.ramp[i].q} (illustrative): ${money(o.ramp[i].actual)}`,"Mercer");
  const realized=o.ramp.reduce((s,q)=>s+(q.actual||0),0), mid=(o.lo+o.hi)/2;
  if(o.ramp.every(q=>q.actual!=null)){
    o.status="realized"; o.stage="realized";
    o.closure={ committed:Math.round(mid), realized, variance:realized-Math.round(mid) };
    pushEv(o,"realized",`Play closed — realized ${money(realized)} vs committed ${money(mid)}`);
    toast(o.id+" fully realized — closure card ready to sign off.","success");
  }
}

/* -------- events -------- */
document.addEventListener("click", e=>{
  const a=e.target.closest("[data-a]"); if(!a) return;
  const act=a.dataset.a, id=a.dataset.id, v=a.dataset.v;
  const o = id ? byId(id) : (S.dlg && S.dlg.id ? byId(S.dlg.id) : null);
  switch(act){
    case "nav": S.page=v; render(); break;
    case "tab": S.tab=v; S.sel.clear(); render(); break;
    case "sort": S.sort = S.sort.field===v ? {field:v,dir:S.sort.dir==="desc"?"asc":"desc"} : {field:v,dir:"desc"}; render(); break;
    case "confchip": S.confMin=S.confMin?0:75; render(); break;
    case "clearfilters": Object.assign(S,{q:"",lever:"",country:"",confMin:0,scopeL2:"",groupBy:"none"}); render(); break;
    case "selall": { const r=filteredSorted(tabRows("feed")); const all=r.every(x=>S.sel.has(x.id)); r.forEach(x=>all?S.sel.delete(x.id):S.sel.add(x.id)); render(); break; }
    case "selrow": S.sel.has(id)?S.sel.delete(id):S.sel.add(id); render(); break;
    case "bulk-clear": S.sel.clear(); render(); break;
    case "bulk-park": S.dlg={kind:"park",bulk:true,trigType:"date"}; render(); break;
    case "bulk-reject": S.dlg={kind:"reject",bulk:true}; render(); break;
    case "open": openOpp(id); break;
    case "mclose": case "actclose": S.modal=null; S.act=null; render(); break;
    case "ovclose": if(e.target===e.currentTarget||e.target.classList.contains("overlay")){ S.modal=null; S.act=null; render(); } break;
    case "mtab": S.modalTab=v; render(); break;
    case "mnav": { const rows=modalRows(); const ix=rows.findIndex(x=>x.id===S.modal); const nx=rows[ix+(+v)]; if(nx) openOpp(nx.id); break; }
    case "whytoggle": byId(S.modal).whyOpen=!byId(S.modal).whyOpen; render(); break;
    case "approve": approve(id); break;
    case "dlg-park": S.dlg={kind:"park",id,trigType:"date"}; render(); break;
    case "dlg-reject": S.dlg={kind:"reject",id}; render(); break;
    case "dlg-unreject": S.dlg={kind:"unreject",id}; render(); break;
    case "dlg-uncommit": S.dlg={kind:"uncommit",id}; render(); break;
    case "dlgcancel": if(a.tagName==="BUTTON"||e.target.classList.contains("overlay")){ S.dlg=null; render(); } break;
    case "dlgset": S.dlg[a.dataset.k]=v; render(); break;
    case "park-confirm": parkConfirm(); break;
    case "reject-confirm": rejectConfirm(); break;
    case "unreject-confirm": { o.status="qualified"; pushEv(o,"note","Restored to feed — "+S.dlg.note); o.signal={kind:"changed",label:"Restored",why:"Un-rejected: "+S.dlg.note.slice(0,50)}; S.dlg=null; S.modal=null; S.tab="feed"; toast(o.id+" restored to feed — history preserved.","success"); render(); break; }
    case "uncommit-confirm": { o.status="qualified"; o.stage=null; o.ramp=null; o.closure=null; pushEv(o,"note","Un-committed — "+S.dlg.note+" · pre-commit figures restored"); S.dlg=null; S.page="opps"; S.tab="feed"; toast(o.id+" un-committed — returned to feed as qualified.","warn"); render(); break; }
    case "unpark": o.status="qualified"; o.parkTrigger=null; o.signal=null; pushEv(o,"note","Returned to feed from Parked"); S.modal=null; S.tab="feed"; toast("Returned to feed.","success"); render(); break;
    case "lineage": S.pop={id,fig:a.dataset.fig}; render(); break;
    case "popclose": if(a.tagName==="BUTTON"||e.target.classList.contains("overlay")){ S.pop=null; render(); } break;
    case "dispute": S.pop=null; pushEv(byId(id),"note","Carve-out disputed → routed to data steward (P4)"); toast("Dispute recorded — routed to the data steward with your reason."); render(); break;
    case "vendorpop": toast("Vendor record: "+a.dataset.vn+" — opens the vendor detail panel in the full build."); break;
    case "regen": { const u=o.userInput; const res0={addr:o.engine.movable,lo:o.engine.lo,hi:o.engine.hi};
      o.uinDirty=false; const res1=resolved(o);
      o.regenDiff={addr0:res0.addr,addr1:res1.addr,lo0:res0.lo,hi0:res0.hi,lo1:res1.lo,hi1:res1.hi,note:(u.overrideAddr!=null||u.overridePct!=null)?("Operator override — "+(u.justification||"")):"Context saved — no figure changes"};
      pushEv(o,"note","Analysis regenerated with operator input"+(u.justification?" · "+u.justification:""));
      toast("Regenerated — the diff shows exactly what changed.","success"); render(); break; }
    case "goto-vr": S.page="vr"; S.vrSel=id; S.modal=null; render(); break;
    /* Act */
    case "pickpb": o.play.approach=v; render(); break;
    case "task": o.play.done[v]=!o.play.done[v]; render(); break;
    case "gendraft": pushDraft(o,o.play.draftKind,"Mercer","initial template · grounded in "+o.id); pushEv(o,"note","Draft v1 generated ("+o.play.draftKind+")","Mercer"); render(); break;
    case "draftkind": o.play._editBuf=null; o.play.draftKind=v; render(); break;
    case "draftver": o.play.activeVer[o.play.draftKind]=+v; o.play._editBuf=null; render(); break;
    case "savever": { const k=o.play.draftKind; if(o.play._editBuf!=null){ pushDraft(o,k,"Maria Vance","manual edit"); o.play._editBuf=null; toast("Saved as v"+o.play.activeVer[k]+".","success"); } else toast("No edits to save — the draft is unchanged."); render(); break; }
    case "copydraft": { const k=o.play.draftKind; const d=o.play.drafts[k][o.play.activeVer[k]-1]; navigator.clipboard?.writeText(d.text); toast("Draft copied to clipboard."); break; }
    case "analyze": analyzeEvidence(o); render(); break;
    case "saveplay": pushEv(o,"note","Play progress saved (approach + checklist + drafts)"); toast("Progress saved — survives reload & engine re-runs.","success"); break;
    case "commit": commit(id); break;
    /* VR */
    case "vrsel": S.vrSel=id; render(); break;
    case "marklive": o.status="in-execution"; o.stage="in-execution"; pushEv(o,"stage-advanced","Stage advanced · committed → in-execution"); toast(o.id+" marked live."); render(); break;
    case "markback": o.status="committed"; o.stage="committed"; pushEv(o,"stage-advanced","Stage moved back · in-execution → committed"); render(); break;
    case "postq": postQuarter(o); render(); break;
    case "signoff": o.signedOff=true; pushEv(o,"note","Realization signed off — feeds exec rollup → Shibumi"); toast("Signed off — realized value locked into the rollup.","success"); render(); break;
    case "drift-ramp": o.drift={flagged:false,note:""}; o.driftAdj=true; o.ramp.forEach(q=>{ if(q.actual==null) q.proj=Math.round(q.proj*0.92); }); pushEv(o,"drift-cleared","Applied revised ramp (−8%) after drift review"); toast("Revised ramp applied — projections trimmed 8%.","success"); render(); break;
    case "drift-esc": o.drift={flagged:false,note:""}; pushEv(o,"drift-cleared","Drift reviewed — escalated, original plan kept"); toast("Escalated — original ramp kept; noted in the trail.","success"); render(); break;
    /* sweep + mercer */
    case "sweep": runSweep(); break;
    case "mercer-open": S.mercer={open:true,oppId:id||S.modal||S.act,thread:S.mercer.oppId===(id||S.modal||S.act)?S.mercer.thread:[],q:""}; render(); break;
    case "mercer-close": S.mercer.open=false; render(); break;
    case "mercer-sugg": S.mercer.q=v; mercerSend(); break;
    case "mercer-send": mercerSend(); break;
  }
});

function mercerSend(){
  const m=S.mercer; const q=(m.q||"").trim(); if(!q) return;
  const o=m.oppId?byId(m.oppId):null;
  m.thread.push({who:"user",text:esc(q)});
  const ans=mercerAnswer(o,q);
  m.thread.push({who:"mercer",text:ans.text,cite:ans.cite});
  m.q="";
  render();
  const th=el("mthread"); if(th) th.scrollTop=th.scrollHeight;
}

/* inputs — surgical updates, no full re-render on keystrokes */
document.addEventListener("input", e=>{
  const t=e.target; const k=t.dataset.in; if(!k) return;
  const o=t.dataset.id?byId(t.dataset.id):null;
  switch(k){
    case "q": S.q=t.value; renderSoft(); break;
    case "lever": S.lever=t.value; renderSoft(); break;
    case "country": S.country=t.value; renderSoft(); break;
    case "groupby": S.groupBy=t.value; renderSoft(); break;
    case "scope-l2": S.scopeL2=t.value; renderSoft(); break;
    case "uin-context": o.userInput.context=t.value; o.uinDirty=true; break;
    case "uin-addr": o.userInput.overrideAddr=t.value===""?null:+t.value; o.uinDirty=true; softGate(o); break;
    case "uin-pct": o.userInput.overridePct=t.value===""?null:+t.value; o.uinDirty=true; softGate(o); break;
    case "uin-just": o.userInput.justification=t.value; softGate(o); break;
    case "evnote": o.play.evNote=t.value; { const b=document.querySelector('[data-a="analyze"]'); if(b) b.disabled=!t.value.trim(); } break;
    case "drafttext": o.play._editBuf=t.value; break;
    case "dlg-date": S.dlg.date=t.value; renderLayer(); break;
    case "dlg-other": S.dlg.other=t.value; { const b=document.querySelector('[data-a="park-confirm"]'); if(b) b.disabled=!t.value.trim(); } break;
    case "dlg-note": S.dlg.note=t.value; { const b=document.querySelector('[data-a="reject-confirm"],[data-a="unreject-confirm"],[data-a="uncommit-confirm"]'); if(b&&S.dlg.kind!=="reject") b.disabled=!t.value.trim(); if(b&&S.dlg.kind==="reject") b.disabled=!(S.dlg.reason&&(S.dlg.reason!=="Other (specify)"||t.value.trim())); } break;
    case "mercer-q": S.mercer.q=t.value; break;
    case "timing": o.timing=t.value; renderLayer(); break;
    case "basis": o.basis=t.value; renderLayer(); break;
  }
});
function softGate(o){ const b=document.querySelector('[data-a="regen"]'); if(!b) return;
  const need=(o.userInput.overrideAddr!=null||o.userInput.overridePct!=null); b.disabled=need&&!o.userInput.justification.trim(); }
function renderSoft(){ // re-render but keep focus in the search box
  const focused=document.activeElement; const key=focused?.dataset?.in; const pos=focused?.selectionStart;
  render();
  if(key){ const nf=document.querySelector(`[data-in="${key}"]`); if(nf){ nf.focus(); if(pos!=null&&nf.setSelectionRange) try{nf.setSelectionRange(pos,pos);}catch(_){} } }
}
document.addEventListener("keydown", e=>{
  if(e.key==="Enter"&&e.target.dataset?.in==="mercer-q") mercerSend();
  if(e.key==="Escape"){ if(S.pop){S.pop=null;} else if(S.dlg){S.dlg=null;} else if(S.mercer.open){S.mercer.open=false;} else {S.modal=null;S.act=null;} render(); }
});

render();
</script></body></html>
